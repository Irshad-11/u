<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="referrer" content="no-referrer">
<meta name="theme-color" content="#f2f3ef">
<title>New tab</title>
<!--
  MANTEL — a start page in one file. No backend, no account, no build step.
  Host this file as index.html on GitHub Pages (or any static host).

  STORAGE
    localStorage  mantel.state     the live configuration (JSON, see "state shape" below)
                  mantel.profiles  named profiles, each a full copy of the state
                  mantel.cache     weather / news responses, safe to delete
    IndexedDB     mantel > kv      uploaded background images (img:<id>) and automatic backups (backup:<time>)
    Clearing site data for this origin erases all of it. Use Settings > Backup and import to keep a file.

  STATE SHAPE (format 1)
    { v, prefs, look:{theme, custom, themes[]}, grid, search:{engines[], engine},
      layouts:[{id, name, widgets:[{id, type, w, h, row, collapsed, pinned, title, cfg}]}], active,
      data:{bookmarks, tasks, notes, countdowns, timer, stopwatch, pomo, events, habits} }

  EXPORT FILE
    { app:"mantel", format:1, exported, sections:{...any of the keys in SECTIONS...}, images:{id:dataURL} }
    Every section is run through the same CLEAN.* sanitiser used at startup, so a bad file cannot break the page.
    When the format changes, bump FORMAT and add a function to MIGRATE[oldFormat].

  EXTENDING
    New widget:  reg('type', {name, desc, cat, w, cfg:{defaults}, fields:[...], render(body, cfg, ctx)})
    New theme:   add an object to THEMES. Optional bespoke CSS goes under html[data-theme="id"].
    New section: add an entry to SECTIONS and a sanitiser to CLEAN.
-->
<style>
/* ───────── tokens ───────── */
:root{
  --bg:#f2f3ef;--surface:#fff;--ink:#1a1f1c;--muted:#65706a;--line:#d6dbd5;--accent:#2b5c88;--accent-ink:#fff;
  --danger:#b3261e;--radius:6px;--bw:1px;--bs:solid;--alpha:1;--scale:1;
  --font:system-ui,sans-serif;--font-d:var(--font);--font-m:ui-monospace,"SF Mono",Menlo,Consolas,monospace;
  --gap:22px;--pad:28px;--maxw:1080px;
  --hover:color-mix(in srgb,var(--ink) 8%,transparent);
  --panel:color-mix(in srgb,var(--surface) calc(var(--alpha)*100%),transparent);
}
*{box-sizing:border-box}
html{font-size:calc(16px*var(--scale))}
body{margin:0;min-height:100vh;background:var(--bg);color:var(--ink);font:400 .9375rem/1.45 var(--font);-webkit-font-smoothing:antialiased}
button,input,select,textarea{font:inherit;color:inherit;letter-spacing:inherit}
button{cursor:pointer}
a{color:inherit}
h1,h2,h3,p{margin:0}
ul,ol{margin:0;padding:0;list-style:none}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px}
::selection{background:var(--accent);color:var(--accent-ink)}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip-path:inset(50%);white-space:nowrap}
[hidden]{display:none!important}
.muted{color:var(--muted)}.small{font-size:.8125rem}.num{font-variant-numeric:tabular-nums}
.grow{flex:1;min-width:0}.flex{display:flex;align-items:center;gap:8px}.wrap{flex-wrap:wrap}
.ell{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}

/* ───────── background layers ───────── */
#bg,#pat,#fx,#dim{position:fixed;inset:0;z-index:-1;pointer-events:none}
#bg{background-size:cover;background-position:center}
#fx{width:100%;height:100%}
#pat[data-p=grid]{background-image:linear-gradient(var(--line) 1px,transparent 1px),linear-gradient(90deg,var(--line) 1px,transparent 1px);background-size:28px 28px}
#pat[data-p=dots]{background-image:radial-gradient(var(--line) 1.2px,transparent 1.4px);background-size:22px 22px}
#pat[data-p=ruled]{background-image:linear-gradient(90deg,transparent 63px,color-mix(in srgb,var(--accent) 45%,transparent) 63px 64px,transparent 64px),linear-gradient(transparent 27px,var(--line) 27px);background-size:100% 100%,100% 28px}

/* ───────── controls ───────── */
.btn{border:var(--bw) var(--bs) var(--line);background:transparent;border-radius:var(--radius);padding:.38rem .75rem;line-height:1.3;white-space:nowrap}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink);font-weight:600}
.btn.primary:hover{filter:brightness(1.08)}
.btn.danger{color:var(--danger);border-color:color-mix(in srgb,var(--danger) 45%,transparent)}
.btn:disabled,.ib:disabled{opacity:.4;cursor:default}
.btn.sm{padding:.2rem .5rem;font-size:.8125rem}
.btn[aria-pressed=true]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.link{border:0;background:none;padding:0;color:var(--muted);text-decoration:underline;text-underline-offset:3px;font-size:.8125rem}
.link:hover{color:var(--ink)}
.ib{border:0;background:transparent;width:28px;height:28px;border-radius:var(--radius);display:inline-grid;place-items:center;color:var(--muted);padding:0;flex:none}
.ib:hover{background:var(--hover);color:var(--ink)}
.ico{display:inline-grid;line-height:0}
.in{border:var(--bw) var(--bs) var(--line);background:var(--panel);border-radius:var(--radius);padding:.38rem .6rem;min-width:0;width:100%}
.in:focus{border-color:var(--accent)}
textarea.in{resize:vertical;min-height:5rem;line-height:1.5}
select.in{width:auto;max-width:100%;padding-right:1.6rem}
input[type=color]{width:38px;height:28px;padding:0;border:var(--bw) solid var(--line);border-radius:4px;background:none}
input[type=range]{accent-color:var(--accent);width:150px;max-width:100%}
input[type=checkbox],input[type=radio]{accent-color:var(--accent);width:1rem;height:1rem;margin:0;flex:none}
::placeholder{color:var(--muted);opacity:.85}
kbd{font:500 .72rem var(--font-m);border:1px solid var(--line);border-radius:4px;padding:1px 5px;color:var(--muted)}

/* ───────── page chrome ───────── */
#bar{display:flex;align-items:center;gap:12px;padding:10px 14px 0;min-height:44px}
#tabs{display:flex;gap:2px;flex-wrap:wrap}
#tabs button{border:0;background:none;padding:4px 10px;border-radius:var(--radius);color:var(--muted)}
#tabs button:hover{background:var(--hover)}
#tabs button[aria-current=true]{color:var(--ink);font-weight:600;box-shadow:inset 0 -2px 0 var(--accent);border-radius:0}
#tools{margin-left:auto;display:flex;gap:2px;transition:opacity .15s}
body[data-bar=quiet]:not(.editing) #tools{opacity:.35}
body[data-bar=quiet] #tools:hover,body[data-bar=quiet] #tools:focus-within{opacity:1}
@media (hover:none){body[data-bar=quiet] #tools{opacity:1!important}}
.grid{display:grid;grid-template-columns:repeat(12,minmax(0,1fr));gap:var(--gap);max-width:var(--maxw);margin:0 auto;padding:var(--pad);align-items:start}
body[data-valign=center] .grid{min-height:calc(100vh - 60px);align-content:center}
.empty{grid-column:1/-1;text-align:center;padding:14vh 0;color:var(--muted)}
.empty p{margin-bottom:12px}
#editbar{position:fixed;left:50%;bottom:16px;translate:-50% 0;z-index:20;display:flex;align-items:center;gap:10px;background:var(--ink);color:var(--bg);padding:8px 8px 8px 16px;border-radius:var(--radius);max-width:calc(100vw - 24px)}
#editbar .btn{border-color:color-mix(in srgb,var(--bg) 35%,transparent);color:var(--bg)}
#editbar .btn.primary{background:var(--bg);color:var(--ink);border-color:var(--bg)}
#toasts{position:fixed;left:16px;bottom:16px;z-index:9999;display:flex;flex-direction:column;gap:8px;max-width:min(420px,calc(100vw - 32px))}
.toast{background:var(--ink);color:var(--bg);padding:9px 14px;border-radius:var(--radius);display:flex;gap:14px;align-items:center;font-size:.875rem}
.toast.err{box-shadow:inset 3px 0 0 #e5604d}
.tbtn{border:0;background:none;color:inherit;font-weight:700;text-decoration:underline;padding:0;white-space:nowrap}

/* ───────── widget frame ───────── */
.w{position:relative;min-width:0;grid-column:span 4;display:flex;flex-direction:column}
.w[data-w="2"]{grid-column:span 2}.w[data-w="3"]{grid-column:span 3}.w[data-w="4"]{grid-column:span 4}.w[data-w="5"]{grid-column:span 5}
.w[data-w="6"]{grid-column:span 6}.w[data-w="7"]{grid-column:span 7}.w[data-w="8"]{grid-column:span 8}.w[data-w="9"]{grid-column:span 9}
.w[data-w="10"]{grid-column:span 10}.w[data-w="11"]{grid-column:span 11}.w[data-w="12"]{grid-column:span 12}
.w[data-row]{grid-column:1/-1;width:calc(var(--wn)/12*100%)}
.w[data-row=center]{justify-self:center}.w[data-row=end]{justify-self:end}
.w-h{display:flex;align-items:center;gap:6px;min-height:28px;margin-bottom:8px}
.w-t{font:600 .8125rem/1.2 var(--font);color:var(--muted);flex:1;min-width:0}
.w-a{display:flex;opacity:0;transition:opacity .12s}
.w:hover .w-a,.w:focus-within .w-a,body.editing .w-a{opacity:1}
@media (hover:none){.w-a{opacity:.6}}
.w-drag{display:none;cursor:grab;touch-action:none}
.w-b{min-width:0;min-height:0;flex:1}
.w[data-fixed] .w-b{overflow:auto}
.w.collapsed .w-h{margin-bottom:0}
.w-rs{display:none;position:absolute;right:-6px;bottom:-6px;width:18px;height:18px;cursor:nwse-resize;touch-action:none;border-right:3px solid var(--accent);border-bottom:3px solid var(--accent)}
.w.bare .w-h{position:absolute;inset:-28px 0 auto 0;margin:0;z-index:2;pointer-events:none}
.w.bare .w-h>*{pointer-events:auto}.w.bare .w-t{visibility:hidden}
body.editing .w.bare .w-t{visibility:visible}
body.editing .w.bare .w-h{position:static;margin-bottom:8px}
body.editing .w{outline:1px dashed var(--muted);outline-offset:5px}
body.editing .grid{padding-bottom:96px}
body.editing .w-drag{display:inline-grid}body.editing .w-rs{display:block}
body.editing .w.pinned .w-drag{visibility:hidden}
.w.sortable-ghost{opacity:.35}.w.sortable-chosen{cursor:grabbing}
.pinmark{color:var(--accent);display:inline-grid}
.werr{color:var(--danger);font-size:.875rem}

/* surface styles */
html[data-surface=none] .w:not(.bare){border-top:var(--bw) var(--bs) var(--line);padding-top:8px}
html[data-surface=line] .w:not(.bare),html[data-surface=fill] .w:not(.bare),html[data-surface=offset] .w:not(.bare),html[data-surface=window] .w:not(.bare){background:var(--panel);border-radius:var(--radius);padding:12px 14px 14px}
html[data-surface=line] .w:not(.bare),html[data-surface=window] .w:not(.bare){border:var(--bw) var(--bs) var(--line)}
html[data-surface=offset] .w:not(.bare){border:2px solid var(--ink);box-shadow:4px 4px 0 var(--ink)}
html[data-surface=window] .w:not(.bare){padding-top:0}
html[data-surface=window] .w:not(.bare) .w-h{margin:0 -14px 12px;padding:2px 6px;border-bottom:var(--bw) solid var(--line);background:repeating-linear-gradient(var(--line) 0 1px,transparent 1px 4px) 0 7px/100% 14px no-repeat}
html[data-surface=window] .w:not(.bare) .w-t{flex:none;margin:0 auto;background:var(--surface);padding:0 10px;color:var(--ink)}
html[data-surface=window] .w:not(.bare) .w-a,html[data-surface=window] .w:not(.bare) .w-drag{background:var(--surface)}

/* ───────── menus, dialogs ───────── */
.menu{position:fixed;z-index:9000;min-width:190px;background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);padding:4px;box-shadow:0 6px 24px rgb(0 0 0/.16);max-height:70vh;overflow:auto}
.menu button{display:flex;align-items:center;gap:8px;width:100%;border:0;background:none;text-align:left;padding:6px 8px;border-radius:calc(var(--radius) - 2px)}
.menu button:hover,.menu button:focus-visible{background:var(--hover);outline:0}
.menu button span:nth-child(2),.menu button span:only-child{flex:1}
.menu button.danger{color:var(--danger)}
.menu hr{border:0;border-top:1px solid var(--line);margin:4px 0}
dialog{background:var(--surface);color:var(--ink);border:1px solid var(--line);border-radius:calc(var(--radius) + 2px);padding:0;max-width:calc(100vw - 24px);box-shadow:0 20px 60px rgb(0 0 0/.25)}
dialog::backdrop{background:rgb(0 0 0/.38)}
.dlg{width:440px}
.dlg form{padding:18px 20px;display:flex;flex-direction:column;gap:12px;max-height:calc(100vh - 60px);overflow:auto}
.dlg h2{font:600 1.05rem var(--font-d)}
.fld{display:flex;flex-direction:column;gap:4px}
.fld>label,.fld>.lab{font-size:.8125rem;font-weight:600}
.fld.inline{flex-direction:row;align-items:center;gap:8px}.fld.inline>label{font-weight:400;font-size:inherit}
.fld .help{font-size:.78rem;color:var(--muted)}
.dlg-f{display:flex;gap:8px;justify-content:flex-end;margin-top:6px}
.dlg-f .left{margin-right:auto}
.alert{color:var(--danger);font-size:.875rem}

/* ───────── settings ───────── */
#settings{width:900px;height:min(720px,calc(100vh - 40px));overflow:hidden}
#settings[open]{display:grid;grid-template-columns:190px 1fr;grid-template-rows:auto 1fr}
.s-top{grid-column:1/-1;display:flex;align-items:center;gap:10px;padding:10px 12px 10px 18px;border-bottom:1px solid var(--line)}
.s-top h2{font:600 1rem var(--font-d);margin-right:auto}
.s-top .in{width:200px}
.s-nav{border-right:1px solid var(--line);padding:10px 8px;overflow:auto;display:flex;flex-direction:column;gap:1px}
.s-nav button{border:0;background:none;text-align:left;padding:7px 10px;border-radius:var(--radius)}
.s-nav button:hover{background:var(--hover)}
.s-nav button[aria-selected=true]{background:var(--ink);color:var(--surface)}
.s-body{overflow:auto;padding:6px 22px 28px}
.s-body h3{font:600 .95rem var(--font-d);margin:22px 0 2px}
.s-body h3+p{color:var(--muted);font-size:.8125rem;margin-bottom:6px;max-width:62ch}
.row{display:flex;align-items:center;gap:16px;padding:9px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent)}
.row>.rl{flex:1;min-width:0}.row .rd{font-size:.78rem;color:var(--muted)}
.row>.rc{display:flex;align-items:center;gap:8px;flex-wrap:wrap;justify-content:flex-end;max-width:60%}
.tg{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:12px;margin-top:10px}
.tcard{border:1px solid var(--line);border-radius:6px;padding:0;background:none;text-align:left;overflow:hidden;display:flex;flex-direction:column}
.tcard[data-on=true]{outline:2px solid var(--accent);outline-offset:2px}
.tprev{height:78px;padding:9px 10px;display:flex;flex-direction:column;justify-content:space-between;position:relative}
.tprev b{font-size:1.35rem;line-height:1;font-weight:600}
.tprev i{display:flex;gap:4px;font-style:normal}
.tprev i span{height:9px;border-radius:2px;flex:1}
.tname{padding:6px 10px;font-size:.8125rem;border-top:1px solid var(--line);display:flex;justify-content:space-between;gap:6px;align-items:center}
.lib{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:0 22px}
.lib-i{padding:10px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);display:flex;gap:10px;align-items:flex-start}
.lib-i p{font-size:.78rem;color:var(--muted)}
.tag{font-size:.7rem;border:1px solid var(--line);border-radius:3px;padding:0 5px;color:var(--muted);white-space:nowrap}
.pv{border:1px dashed var(--line);border-radius:6px;padding:12px;margin:8px 0;grid-column:1/-1}
.tbl{width:100%;border-collapse:collapse;font-size:.875rem;margin-top:8px}
.tbl th{text-align:left;font-weight:600;color:var(--muted);font-size:.78rem}
.tbl th,.tbl td{padding:6px 8px 6px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 60%,transparent);vertical-align:top}
.checks{display:grid;grid-template-columns:repeat(auto-fill,minmax(210px,1fr));gap:4px 16px;margin:8px 0}
.checks label{display:flex;gap:8px;align-items:flex-start}.checks .sub{margin-left:24px;font-size:.8125rem}
.drop{border:1px dashed var(--muted);border-radius:6px;padding:18px;text-align:center;color:var(--muted);margin:8px 0}
.drop.over{background:var(--hover);color:var(--ink)}

/* ───────── widgets ───────── */
.clock{line-height:1}
.clock-t{font:600 clamp(2.6rem,calc(var(--cs,1)*8.5vw),calc(var(--cs,1)*7rem))/1 var(--font-d);font-variant-numeric:tabular-nums;letter-spacing:-.025em}
.clock-t small{font-size:.32em;font-weight:500;margin-left:.3em;letter-spacing:0;color:var(--muted)}
.clock-d{margin-top:.6rem;color:var(--muted);font-size:1.02rem}
.greet{font:500 1.6rem/1.2 var(--font-d)}
.sform{display:flex;align-items:center;gap:0;border:var(--bw) var(--bs) var(--line);border-radius:var(--radius);background:var(--panel)}
.sform:focus-within{border-color:var(--accent);outline:2px solid color-mix(in srgb,var(--accent) 35%,transparent)}
.sform .eng{border:0;background:none;padding:.6rem .7rem;color:var(--muted);border-right:var(--bw) var(--bs) var(--line);white-space:nowrap;font-size:.875rem}
.sform .eng:hover{color:var(--ink)}
.sform input{border:0;background:none;flex:1;min-width:0;padding:.65rem .8rem;font-size:1.02rem;outline:0}
.sugg{margin-top:4px;border:1px solid var(--line);border-radius:var(--radius);background:var(--surface);position:absolute;left:0;right:0;z-index:5;overflow:hidden}
.sugg li{display:flex;gap:10px;padding:6px 10px;cursor:pointer;align-items:center}
.sugg li[aria-selected=true]{background:var(--hover)}
.fav{--sz:28px;width:var(--sz);height:var(--sz);flex:none;display:inline-grid;place-items:center;border-radius:calc(var(--radius)*.7);overflow:hidden;font-size:calc(var(--sz)*.5);line-height:1}
.fav img{width:100%;height:100%;object-fit:contain}
.fav.l{background:var(--hover);font-weight:600;color:var(--ink)}
.bm-pin{display:flex;flex-wrap:wrap;gap:4px;margin-bottom:6px}
.bm-pin.c{justify-content:center}
.lk{display:flex;align-items:center;gap:9px;padding:5px 8px;border-radius:var(--radius);text-decoration:none;min-width:0}
.lk:hover{background:var(--hover)}
.lk.tile{flex-direction:column;gap:5px;width:calc(var(--sz,28px) + 44px);padding:8px 4px;text-align:center;font-size:.78rem}
.lk.tile span:last-child{max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bm-g .gh{display:flex;align-items:center;gap:6px;width:100%;border:0;background:none;padding:6px 4px;text-align:left;border-top:1px solid color-mix(in srgb,var(--line) 70%,transparent)}
.bm-g .gh .ico{transition:rotate .12s;color:var(--muted)}
.bm-g .gh[aria-expanded=true] .ico{rotate:90deg}
.bm-g .gh .n{color:var(--muted);font-size:.78rem;margin-left:auto}
.bm-links{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:2px;padding:2px 0 8px}
.bm-links.tiles{display:flex;flex-wrap:wrap}
.bm-links.manage{grid-template-columns:1fr}
.bm-row{display:flex;align-items:center;gap:2px;min-width:0}.bm-row .lk{flex:1}
.bm-foot{display:flex;gap:14px;margin-top:6px;opacity:0;transition:opacity .12s}
.w:hover .bm-foot,.w:focus-within .bm-foot,.bm-foot.on{opacity:1}
@media (hover:none){.bm-foot{opacity:1}}
.addrow{display:flex;gap:6px;margin-bottom:8px}.addrow select,.addrow .btn{flex:none}.addrow input{flex:1}
.list>li{display:flex;align-items:flex-start;gap:8px;padding:5px 0;border-bottom:1px solid color-mix(in srgb,var(--line) 55%,transparent)}
.list>li:last-child{border-bottom:0}
.list .acts{display:flex;opacity:0}.list li:hover .acts,.list li:focus-within .acts{opacity:1}
@media (hover:none){.list .acts{opacity:1}}
.task input[type=checkbox]{margin-top:.2rem}
.task.done .tx{text-decoration:line-through;color:var(--muted)}
.task .tx{flex:1;min-width:0;overflow-wrap:anywhere}
.pri{width:8px;height:8px;border-radius:50%;margin-top:.45rem;flex:none;border:1.5px solid var(--muted)}
.pri.p1{background:var(--muted)}.pri.p2{background:var(--accent);border-color:var(--accent)}.pri.p3{background:var(--danger);border-color:var(--danger)}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:var(--radius);overflow:hidden}
.seg button{border:0;background:none;padding:2px 9px;font-size:.78rem}
.seg button[aria-pressed=true]{background:var(--ink);color:var(--surface)}
.tabs{display:flex;gap:2px;flex-wrap:wrap;margin-bottom:6px;align-items:center}
.tabs button.t{border:0;background:none;padding:2px 8px;border-radius:var(--radius);font-size:.8125rem;color:var(--muted);max-width:12ch}
.tabs button.t[aria-selected=true]{background:var(--hover);color:var(--ink);font-weight:600}
.note{width:100%;min-height:9rem;border:0;background:none;resize:vertical;line-height:1.55;padding:0;outline-offset:4px}
.cal table{width:100%;border-collapse:collapse;table-layout:fixed}
.cal th{font-weight:500;font-size:.72rem;color:var(--muted);padding:4px 0}
.cal td{text-align:center;padding:1px}
.cal td button{width:100%;aspect-ratio:1.25;max-height:38px;border:0;background:none;border-radius:var(--radius);position:relative;font-variant-numeric:tabular-nums}
.cal td button:hover{background:var(--hover)}
.cal td.o button{color:color-mix(in srgb,var(--muted) 55%,transparent)}
.cal td.today button{background:var(--accent);color:var(--accent-ink);font-weight:700}

<script>
'use strict';
/* ═════════ 1. utilities ═════════ */
const APP='mantel', FORMAT=1;
const KEY={state:APP+'.state',profiles:APP+'.profiles',cache:APP+'.cache'};
const $=(s,r=document)=>r.querySelector(s), $$=(s,r=document)=>[...r.querySelectorAll(s)];
const uid=()=>Math.random().toString(36).slice(2,9)+Date.now().toString(36).slice(-3);
const clamp=(n,a,b)=>Math.min(b,Math.max(a,n));
const pad=n=>String(n).padStart(2,'0');
const clone=o=>JSON.parse(JSON.stringify(o));
const ymd=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const isObj=v=>v&&typeof v==='object'&&!Array.isArray(v);
const reducedMotion=()=>matchMedia('(prefers-reduced-motion:reduce)').matches;
const typing=e=>{const t=e.target;return t.isContentEditable||/^(INPUT|TEXTAREA|SELECT)$/.test(t.tagName)};
function debounce(fn,ms){let t=0;const d=(...a)=>{clearTimeout(t);t=setTimeout(()=>{t=0;fn(...a)},ms)};d.flush=()=>{if(t){clearTimeout(t);t=0;fn()}};return d}

const PROPS=new Set(['checked','disabled','selected','hidden','open','tabIndex','readOnly','required']);
function h(tag,a,...kids){
  const e=document.createElement(tag);let late;
  for(const k in a||{}){
    const v=a[k];
    if(k==='value'){late=v;continue}
    if(PROPS.has(k)){e[k]=!!v||v===0?v:false;continue}
    if(v==null||v===false)continue;
    if(k==='class')e.className=v;
    else if(k==='text')e.textContent=v;
    else if(k==='style'){for(const s in v){if(v[s]==null)continue;s.startsWith('--')?e.style.setProperty(s,v[s]):e.style[s]=v[s]}}
    else if(k.startsWith('on'))e.addEventListener(k.slice(2),v);
    else e.setAttribute(k,v===true?'':v);
  }
  add(e,kids);
  if(late!=null)e.value=late;
  return e;
}
function add(e,kids){for(const k of kids.flat(9)){if(k==null||k===false||k==='')continue;e.appendChild(k.nodeType?k:document.createTextNode(String(k)))}return e}
/* put(parent, ...children): like append(), but skips null/false and flattens arrays */
const put=(e,...kids)=>add(e,kids);

const ICONS={
  plus:'<path d="M12 5v14M5 12h14"/>',x:'<path d="M6 6l12 12M18 6L6 18"/>',check:'<path d="M5 12.5l4.5 4.5L19 7"/>',
  chev:'<path d="M9 6l6 6-6 6"/>',more:'<circle cx="5" cy="12" r="1.3" fill="currentColor"/><circle cx="12" cy="12" r="1.3" fill="currentColor"/><circle cx="19" cy="12" r="1.3" fill="currentColor"/>',
  grip:'<circle cx="9" cy="6" r="1.2" fill="currentColor"/><circle cx="15" cy="6" r="1.2" fill="currentColor"/><circle cx="9" cy="12" r="1.2" fill="currentColor"/><circle cx="15" cy="12" r="1.2" fill="currentColor"/><circle cx="9" cy="18" r="1.2" fill="currentColor"/><circle cx="15" cy="18" r="1.2" fill="currentColor"/>',
  sliders:'<path d="M4 7h9M19 7h1M4 17h1M11 17h9"/><circle cx="16" cy="7" r="2.4"/><circle cx="8" cy="17" r="2.4"/>',
  pencil:'<path d="M4 20l1-4L16.5 4.5l3 3L8 19l-4 1z"/>',trash:'<path d="M5 7h14M10 7V4h4v3M7 7l1 13h8l1-13"/>',
  pin:'<path d="M9 4h6l-1 6 3 3H7l3-3-1-6zM12 13v7"/>',up:'<path d="M12 19V5M6 11l6-6 6 6"/>',down:'<path d="M12 5v14M6 13l6 6 6-6"/>',
  play:'<path d="M8 5l11 7-11 7z"/>',pause:'<path d="M8 5v14M16 5v14"/>',reset:'<path d="M4 12a8 8 0 1 0 2.5-5.8M4 4v4.5h4.5"/>',
  ext:'<path d="M14 5h5v5M19 5l-8 8M11 7H6v11h11v-5"/>',undo:'<path d="M9 5L4 10l5 5M4 10h10a4.5 4.5 0 0 1 0 9h-3"/>',
  layout:'<path d="M4 4h7v7H4zM13 4h7v4h-7zM13 10h7v10h-7zM4 13h7v7H4z"/>',fold:'<path d="M6 9l6 6 6-6"/>'
};
function ico(n){const s=h('span',{class:'ico','aria-hidden':'true'});s.innerHTML=`<svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">${ICONS[n]||''}</svg>`;return s}
function ib(icon,label,onclick,extra){return h('button',{type:'button',class:'ib','aria-label':label,title:label,onclick,...extra},ico(icon))}

function toast(msg,{action,fn,ms=4500,err}={}){
  const t=h('div',{class:'toast'+(err?' err':''),role:err?'alert':'status'},h('span',{text:msg}),
    action&&h('button',{class:'tbtn',type:'button',onclick(){t.remove();fn()}},action));
  $('#toasts').append(t);setTimeout(()=>t.remove(),ms);
}
function safeUrl(u){try{const x=new URL(u);return /^https?:$/.test(x.protocol)?x.href:''}catch(e){return ''}}
function fixUrl(u){u=String(u||'').trim();if(!u)return '';if(!/^[a-z][a-z0-9+.-]*:/i.test(u))u='https://'+u;return safeUrl(u)}
const host=u=>{try{return new URL(u).hostname.replace(/^www\./,'')}catch(e){return ''}};
function download(name,text,type='application/json'){
  const a=h('a',{href:URL.createObjectURL(new Blob([text],{type})),download:name});
  put(document.body,a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(a.href),2000);
}
function hexRgb(x){x=String(x||'').replace('#','');if(x.length===3)x=[...x].map(c=>c+c).join('');const n=parseInt(x,16);return isNaN(n)?[128,128,128]:[n>>16&255,n>>8&255,n&255]}
function lum(x){const[r,g,b]=hexRgb(x).map(v=>{v/=255;return v<=.03928?v/12.92:((v+.055)/1.055)**2.4});return .2126*r+.7152*g+.0722*b}
const inkOn=x=>lum(x)>.4?'#111111':'#ffffff';
const isHex=v=>typeof v==='string'&&/^#([0-9a-f]{3}|[0-9a-f]{6})$/i.test(v);

/* ═════════ 2. menus and dialogs ═════════ */
let openMenu=null;
function closeMenu(refocus){if(!openMenu)return;openMenu.el.remove();document.removeEventListener('pointerdown',openMenu.out,true);if(refocus&&openMenu.anchor.isConnected)openMenu.anchor.focus();openMenu=null}
function menu(anchor,items){
  closeMenu();
  const el=h('div',{class:'menu',role:'menu'});
  for(const it of items.filter(Boolean)){
    if(it==='-'){put(el,h('hr'));continue}
    put(el,h('button',{type:'button',role:'menuitem',class:it.danger?'danger':'',disabled:it.disabled,onclick(){closeMenu(true);it.fn()}},
      it.icon&&ico(it.icon),h('span',{text:it.label}),it.hint&&h('kbd',{text:it.hint})));
  }
  (anchor.closest('dialog')||document.body).append(el);
  const r=anchor.getBoundingClientRect(),m=el.getBoundingClientRect();
  el.style.left=clamp(r.right-m.width,8,innerWidth-m.width-8)+'px';
  el.style.top=(r.bottom+m.height+8>innerHeight?Math.max(8,r.top-m.height-4):r.bottom+4)+'px';
  const btns=()=>$$('button:not(:disabled)',el);
  el.addEventListener('keydown',e=>{
    const b=btns(),i=b.indexOf(document.activeElement);
    if(e.key==='ArrowDown'){e.preventDefault();b[(i+1)%b.length].focus()}
    else if(e.key==='ArrowUp'){e.preventDefault();b[(i-1+b.length)%b.length].focus()}
    else if(e.key==='Escape'||e.key==='Tab'){e.preventDefault();e.stopPropagation();closeMenu(true)}
  });
  const out=e=>{if(!el.contains(e.target))closeMenu()};
  document.addEventListener('pointerdown',out,true);
  openMenu={el,anchor,out};btns()[0]?.focus();
}

let fid=0;
/* fields: [{k,label,type:text|url|number|range|check|select|textarea|color|date|datetime,opts:[[value,label]],min,max,step,ph,help}] */
function control(f,val,onInput){
  const id='f'+(++fid),t=f.type||'text';let c;
  const fire=()=>onInput&&onInput(read());
  const read=()=>t==='check'?c.checked:(t==='number'||t==='range')?(c.value===''?null:+c.value):c.value;
  if(t==='select')c=h('select',{id,class:'in',value:val,onchange:fire},f.opts.map(o=>h('option',{value:o[0],text:o[1]??o[0]})));
  else if(t==='textarea')c=h('textarea',{id,class:'in',rows:f.rows||4,placeholder:f.ph,value:val??'',oninput:fire});
  else if(t==='check')c=h('input',{id,type:'checkbox',checked:!!val,onchange:fire});
  else c=h('input',{id,class:t==='range'||t==='color'?null:'in',type:t==='datetime'?'datetime-local':t,min:f.min,max:f.max,step:f.step,placeholder:f.ph,list:f.list,
    value:val??'',oninput:fire,autocomplete:'off',spellcheck:t==='text'?null:'false'});
  return {id,el:c,read};
}
function formDialog({title,note,fields=[],values={},ok='Save',danger,onOk,validate,extra}){
  const ctl={},err=h('p',{class:'alert',role:'alert'});
  const d=h('dialog',{class:'dlg','aria-label':title});
  const form=h('form',{method:'dialog',onsubmit(e){
    e.preventDefault();const v={};for(const k in ctl)v[k]=ctl[k].read();
    const msg=validate&&validate(v);if(msg){err.textContent=msg;return}
    d.close();onOk&&onOk(v);
  }},h('h2',{text:title}),note&&h('p',{class:'muted small',text:note}));
  for(const f of fields){
    const c=ctl[f.k]=control(f,values[f.k]);
    put(form,h('div',{class:'fld'+(f.type==='check'?' inline':'')},
      f.type==='check'?[c.el,h('label',{for:c.id,text:f.label})]:[h('label',{for:c.id,text:f.label}),c.el],
      f.help&&h('span',{class:'help',text:f.help})));
  }
  put(form,err,h('div',{class:'dlg-f'},extra&&h('span',{class:'left'},extra(d)),
    h('button',{type:'button',class:'btn',onclick:()=>d.close()},'Cancel'),
    h('button',{type:'submit',class:'btn '+(danger?'danger':'primary')},ok)));
  put(d,form);d.addEventListener('close',()=>d.remove());
  put(document.body,d);d.showModal();
  return d;
}
const confirmDialog=(title,note,ok,fn)=>formDialog({title,note,ok,danger:true,onOk:fn});

/* ═════════ 3. storage ═════════ */
const mem={};
const store={
  ok:true,warned:false,
  get(k){try{return localStorage.getItem(k)}catch(e){this.ok=false;return mem[k]??null}},
  set(k,v){
    try{localStorage.setItem(k,v);return true}
    catch(e){
      mem[k]=v;this.ok=false;
      if(!this.warned){this.warned=true;const full=e&&/quota/i.test(e.name+e.message);
        toast(full?'Browser storage is full. Recent changes are not being saved. Export a backup, then remove old notes or profiles.'
                  :'This browser is blocking storage, so changes last only until you close the tab.',{err:true,ms:12000})}
      return false;
    }
  },
  del(k){try{localStorage.removeItem(k)}catch(e){}delete mem[k]},
  size(){let n=0;try{for(let i=0;i<localStorage.length;i++){const k=localStorage.key(i);if(k.startsWith(APP))n+=k.length+localStorage.getItem(k).length}}catch(e){}return n*2}
};
/* IndexedDB key-value store: larger blobs (background images, backups) */
const idb={
  db:null,
  open(){return this.db||(this.db=new Promise((res,rej)=>{
    if(!('indexedDB' in window))return rej(new Error('IndexedDB is not available'));
    const r=indexedDB.open(APP,1);r.onupgradeneeded=()=>r.result.createObjectStore('kv');
    r.onsuccess=()=>res(r.result);r.onerror=()=>rej(r.error||new Error('IndexedDB failed'));
  }))},
  async tx(mode,fn){const db=await this.open();return new Promise((res,rej)=>{const t=db.transaction('kv',mode),q=fn(t.objectStore('kv'));t.oncomplete=()=>res(q.result);t.onerror=t.onabort=()=>rej(t.error)})},
  get(k){return this.tx('readonly',s=>s.get(k)).catch(()=>undefined)},
  set(k,v){return this.tx('readwrite',s=>s.put(v,k))},
  del(k){return this.tx('readwrite',s=>s.delete(k)).catch(()=>{})},
  keys(){return this.tx('readonly',s=>s.getAllKeys()).catch(()=>[])}
};
function cacheGet(k){try{return JSON.parse(store.get(KEY.cache)||'{}')[k]||null}catch(e){return null}}
function cacheSet(k,v){let c={};try{c=JSON.parse(store.get(KEY.cache)||'{}')}catch(e){}
  c[k]={t:Date.now(),v};const ks=Object.keys(c);if(ks.length>24)ks.sort((a,b)=>c[a].t-c[b].t).slice(0,ks.length-24).forEach(x=>delete c[x]);
  store.set(KEY.cache,JSON.stringify(c))}

/* ═════════ 4. state, defaults, sanitisers ═════════ */
const W={};                                   // widget registry, filled by reg()
function reg(type,def){W[type]={w:4,cfg:{},fields:[],...def,type}}
function mk(type,over){return {id:uid(),type,w:W[type].w,h:0,row:'',collapsed:false,pinned:false,title:'',cfg:{},...over}}

const ENGINES=[
  {id:'ddg',name:'DuckDuckGo',url:'https://duckduckgo.com/?q=%s',key:'d'},
  {id:'google',name:'Google',url:'https://www.google.com/search?q=%s',key:'g'},
  {id:'bing',name:'Bing',url:'https://www.bing.com/search?q=%s',key:'b'},
  {id:'wiki',name:'Wikipedia',url:'https://en.wikipedia.org/w/index.php?search=%s',key:'w'},
  {id:'yt',name:'YouTube',url:'https://www.youtube.com/results?search_query=%s',key:'y'},
  {id:'gh',name:'GitHub',url:'https://github.com/search?q=%s',key:'gh'}
];
const L=(name,url,pinned)=>({id:uid(),name,url,icon:'',pinned:!!pinned});
function defaultData(){return {
  bookmarks:{groups:[
    {id:uid(),name:'Everyday',links:[L('Mail','https://mail.google.com/',1),L('Calendar','https://calendar.google.com/',1),L('Maps','https://www.openstreetmap.org/'),L('Translate','https://translate.google.com/')]},
    {id:uid(),name:'Reading',links:[L('Wikipedia','https://en.wikipedia.org/',1),L('Hacker News','https://news.ycombinator.com/'),L('BBC News','https://www.bbc.com/news')]},
    {id:uid(),name:'Work',links:[L('GitHub','https://github.com/',1),L('MDN','https://developer.mozilla.org/'),L('Stack Overflow','https://stackoverflow.com/')]}
  ]},
  tasks:[],notes:[{id:uid(),title:'Notes',text:''}],countdowns:[],
  timer:{dur:300000,left:300000,endAt:0,running:false,done:0,label:''},
  stopwatch:{start:0,elapsed:0,running:false,laps:[]},
  pomo:{focus:25,short:5,long:15,every:4,auto:false,phase:'focus',running:false,endAt:0,left:1500000,n:0},
  events:{},habits:[]
}}
function defaultState(){
  const id=uid();
  return {v:FORMAT,
    prefs:{name:'',title:'New tab',h12:false,weekStart:1,favicons:'site',sound:true,bar:'quiet',webfonts:true,rssProxy:''},
    look:{theme:'plain',custom:{},themes:[]},

    search:{engines:clone(ENGINES),engine:'ddg',newTab:false,suggest:true},
    layouts:[{id,name:'Home',widgets:[mk('clock',{w:12,row:'center'}),mk('search',{w:6,row:'center'}),mk('bookmarks',{w:8,row:'center'})]}],
    active:id,data:defaultData()};
}

/* Sanitisers: turn anything into a valid value. `dropped` counts discarded records for the import preview. */
let dropped=0;
const S={
  str:(v,d='',max=4000)=>typeof v==='string'?v.slice(0,max):d,

    [0,.28,.56].forEach(o=>{const osc=actx.createOscillator(),g=actx.createGain();osc.frequency.value=880;osc.connect(g);g.connect(actx.destination);
      const t=actx.currentTime+o;g.gain.setValueAtTime(.0001,t);g.gain.exponentialRampToValueAtTime(.2,t+.02);g.gain.exponentialRampToValueAtTime(.0001,t+.22);osc.start(t);osc.stop(t+.24)})}catch(e){}

function curTheme(){const t=allThemes().find(t=>t.id===state.look.theme)||THEMES[0];return mergeTheme(t,state.look.custom)}

const fontsLoaded=new Set();
function loadFonts(names){
  if(!state.prefs.webfonts)return;
  const need=[...new Set(names)].filter(n=>FONTS[n]&&FONTS[n].g&&!fontsLoaded.has(n));if(!need.length)return;
  need.forEach(n=>fontsLoaded.add(n));
  put(document.head,h('link',{rel:'stylesheet',href:'https://fonts.googleapis.com/css2?'+need.map(n=>'family='+FONTS[n].g).join('&')+'&display=swap'}));
}
const fontStack=n=>(FONTS[n]||FONTS.System).s;
let bgToken=0;
function applyTheme(){
  const t=curTheme(),r=document.documentElement,st=r.style,dark=lum(t.c.bg)<.3;
  r.dataset.theme=t.base||t.id;r.dataset.surface=t.surface;st.colorScheme=dark?'dark':'light';
  for(const k in t.c)st.setProperty('--'+k,t.c[k]);
  st.setProperty('--accent-ink',inkOn(t.c.accent));
  st.setProperty('--danger',dark?'#ff8a7a':'#b3261e');
  st.setProperty('--radius',t.radius+'px');st.setProperty('--bw',t.bw+'px');
  st.setProperty('--bs',(t.base||t.id)==='terminal'?'dashed':'solid');
  st.setProperty('--alpha',t.alpha);st.setProperty('--scale',t.scale);
  st.setProperty('--font',fontStack(t.font));st.setProperty('--font-d',fontStack(t.display));
  loadFonts([t.font,t.display]);
  $('meta[name=theme-color]').content=t.c.bg;
  const G=state.grid;st.setProperty('--maxw',G.maxw+'px');st.setProperty('--gap',G.gap+'px');st.setProperty('--pad',G.pad+'px');
  document.body.dataset.valign=G.valign;document.body.dataset.bar=state.prefs.bar;
  /* background */
  const b=t.bg,bg=$('#bg'),tok=++bgToken;
  bg.style.filter=b.kind==='image'&&b.blur?`blur(${b.blur}px)`:'';bg.style.inset=b.kind==='image'&&b.blur?`-${b.blur*2}px`:'0';
  bg.style.backgroundColor=t.c.bg;bg.style.backgroundImage='';
  if(b.kind==='gradient')bg.style.backgroundImage=`linear-gradient(${b.angle}deg,${b.g1},${b.g2})`;
  else if(b.kind==='image'){
    if(b.imgId)idb.get('img:'+b.imgId).then(d=>{if(tok===bgToken&&d)bg.style.backgroundImage=`url("${d}")`});
    else if(b.img)bg.style.backgroundImage=`url("${b.img.replace(/["\\\n]/g,'')}")`;
  }
  $('#pat').dataset.p=b.pattern;
  $('#dim').style.background=b.dim?`color-mix(in srgb,${t.c.bg} ${Math.round(b.dim*100)}%,transparent)`:'';
  fx.set(b.effect,t.c);
}

/* ═════════ 8. animated backgrounds ═════════
   One canvas, capped near 30 fps, paused while the tab is hidden, a single still frame under reduced motion. */
const fx={
  cv:null,g:null,kind:'none',col:{},p:[],raf:0,last:0,w:0,h:0,
  set(kind,col){
    this.cv=this.cv||$('#fx');this.g=this.g||this.cv.getContext('2d');
    this.kind=FX_KINDS.includes(kind)?kind:'none';this.col=col;cancelAnimationFrame(this.raf);this.raf=0;
    if(this.kind==='none'){this.cv.hidden=true;return}
    this.cv.hidden=false;this.size();this.seed();this.draw(0);
    if(!reducedMotion())this.raf=requestAnimationFrame(t=>this.loop(t));
  },
  size(){const d=Math.min(devicePixelRatio||1,1.5);this.w=innerWidth;this.h=innerHeight;this.cv.width=this.w*d;this.cv.height=this.h*d;this.g.setTransform(d,0,0,d,0,0)},
  seed(){
    const n={stars:Math.min(220,this.w*this.h/7000|0),fireflies:26,rain:Math.min(160,this.w/9|0),snow:Math.min(120,this.w/12|0),aurora:4,waves:3}[this.kind]||0;
    this.p=Array.from({length:n},(_,i)=>({x:Math.random()*this.w,y:Math.random()*this.h,r:Math.random(),s:.4+Math.random()*.6,a:Math.random()*6.28,i}));
  },
  loop(t){
    this.raf=requestAnimationFrame(t=>this.loop(t));
    if(document.hidden||t-this.last<(this.kind==='aurora'?50:32))return;
    const dt=Math.min(.1,(t-this.last)/1000);this.last=t;this.draw(dt,t/1000);
  },
  draw(dt,t=0){
    const g=this.g,W=this.w,H=this.h,ink=hexRgb(this.col.ink).join(','),ac=hexRgb(this.col.accent).join(',');
    g.clearRect(0,0,W,H);
    switch(this.kind){
      case 'stars':for(const p of this.p){p.x-=dt*p.s*3;if(p.x<0)p.x=W;g.fillStyle=`rgba(${ink},${.25+.55*Math.abs(Math.sin(t*p.s*.8+p.a))*p.r})`;g.fillRect(p.x,p.y,p.r>.85?2:1.2,p.r>.85?2:1.2)}break;
      case 'fireflies':for(const p of this.p){p.a+=dt*(p.r-.5)*1.5;p.x+=Math.cos(p.a)*dt*18*p.s;p.y+=Math.sin(p.a)*dt*12*p.s;
        if(p.x<-20)p.x=W+20;if(p.x>W+20)p.x=-20;if(p.y<-20)p.y=H+20;if(p.y>H+20)p.y=-20;
        const al=.15+.6*Math.max(0,Math.sin(t*p.s*1.3+p.i)),R=10+p.r*8,gr=g.createRadialGradient(p.x,p.y,0,p.x,p.y,R);
        gr.addColorStop(0,`rgba(${ac},${al})`);gr.addColorStop(1,`rgba(${ac},0)`);g.fillStyle=gr;g.fillRect(p.x-R,p.y-R,R*2,R*2)}break;
      case 'rain':g.strokeStyle=`rgba(${ink},.22)`;g.lineWidth=1;g.beginPath();for(const p of this.p){const v=520+p.r*380;p.y+=v*dt;p.x-=v*dt*.18;
        if(p.y>H){p.y=-20;p.x=Math.random()*(W+120)}g.moveTo(p.x,p.y);g.lineTo(p.x+3,p.y-16-p.r*10)}g.stroke();break;
      case 'snow':g.fillStyle=`rgba(${ink},.35)`;for(const p of this.p){p.y+=dt*(18+p.r*34);p.x+=Math.sin(t*.6+p.a)*dt*14;
        if(p.y>H+4){p.y=-4;p.x=Math.random()*W}g.beginPath();g.arc(p.x,p.y,1+p.r*2.2,0,6.29);g.fill()}break;
      case 'aurora':for(const p of this.p){const x=W*(.2+.2*p.i)+Math.sin(t*.07*p.s+p.a)*W*.18,y=H*(.25+.1*p.i)+Math.cos(t*.05*p.s+p.a)*H*.12,R=Math.max(W,H)*(.35+p.r*.2),
        gr=g.createRadialGradient(x,y,0,x,y,R);gr.addColorStop(0,`rgba(${p.i%2?ink:ac},${p.i%2?.07:.2})`);gr.addColorStop(1,`rgba(${ac},0)`);g.fillStyle=gr;g.fillRect(0,0,W,H)}break;
      case 'waves':g.lineWidth=1.2;for(const p of this.p){g.strokeStyle=`rgba(${p.i?ink:ac},${.16+p.i*.05})`;g.beginPath();
        for(let x=0;x<=W;x+=12){const y=H*(.72+p.i*.07)+Math.sin(x*.006*(1+p.i*.3)+t*(.25+p.i*.1)+p.a)*(22+p.i*8);x?g.lineTo(x,y):g.moveTo(x,y)}g.stroke()}break;
    }
  }
};
addEventListener('resize',debounce(()=>{if(fx.kind!=='none'){fx.size();fx.seed();fx.draw(0)}},200));

/* Stores an uploaded picture in IndexedDB (downscaled so it stays small) and returns its id. */
async function storeImage(file){
  if(!/^image\//.test(file.type))throw new Error('That file is not an image.');
  const url=URL.createObjectURL(file);
  try{
    const img=await new Promise((res,rej)=>{const i=new Image();i.onload=()=>res(i);i.onerror=()=>rej(new Error('The image could not be read.'));i.src=url});
    const k=Math.min(1,2560/Math.max(img.naturalWidth,img.naturalHeight)),c=h('canvas',{width:Math.round(img.naturalWidth*k),height:Math.round(img.naturalHeight*k)});
    c.getContext('2d').drawImage(img,0,0,c.width,c.height);
    const id=uid();await idb.set('img:'+id,c.toDataURL('image/jpeg',.86));return id;
  }finally{URL.revokeObjectURL(url)}
}

  if(editing)eb.replaceChildren(h('span',{class:'small',text:'Drag the grip to move. Drag a corner to resize.'}),
    h('button',{class:'btn sm',type:'button',onclick:()=>openSettings('widgets')},'Add widget'),

}
function setEditing(on){
  editing=on;document.body.classList.toggle('editing',on);gridSort&&gridSort.option('disabled',!on);renderBar();
  if(on&&!window.Sortable)toast('Dragging is unavailable offline. Use each widget\'s menu to move it.');
}
function switchLayout(id){if(id===state.active)return;state.active=id;save();renderBar();renderGrid()}
function addLayout(){
  formDialog({title:'New layout',fields:[{k:'name',label:'Name'}],values:{name:'Layout '+(state.layouts.length+1)},ok:'Create',
    validate:v=>v.name.trim()?'':'Give the layout a name.',
    onOk(v){snap();const l={id:uid(),name:v.name.trim().slice(0,40),widgets:[]};state.layouts.push(l);state.active=l.id;save();renderAll()}});
}
function layoutMenu(anchor){
  const l=layout(),i=state.layouts.indexOf(l);
  menu(anchor,[
    {label:'Rename…',icon:'pencil',fn(){formDialog({title:'Rename layout',fields:[{k:'name',label:'Name'}],values:{name:l.name},validate:v=>v.name.trim()?'':'Give the layout a name.',onOk(v){snap();l.name=v.name.trim().slice(0,40);save();renderBar()}})}},
    {label:'Duplicate',fn(){snap();const c=clone(l);c.id=uid();c.name=l.name+' copy';c.widgets.forEach(w=>w.id=uid());state.layouts.splice(i+1,0,c);state.active=c.id;save();renderAll()}},
    {label:'Move left',icon:'up',disabled:i===0,fn(){snap();state.layouts.splice(i-1,0,state.layouts.splice(i,1)[0]);save();renderBar()}},
    {label:'Move right',icon:'down',disabled:i===state.layouts.length-1,fn(){snap();state.layouts.splice(i+1,0,state.layouts.splice(i,1)[0]);save();renderBar()}},
    '-',
    {label:'Delete layout',icon:'trash',danger:true,disabled:state.layouts.length<2,fn(){snap();state.layouts.splice(i,1);state.active=state.layouts[Math.max(0,i-1)].id;save();renderAll();toast(`Deleted “${l.name}”`,{action:'Undo',fn:undo})}}
  ]);

function unmount(id){const m=mounts.get(id);if(!m)return;m.token=null;m.clean.forEach(f=>{try{f()}catch(e){}});m.clean=[];m.ticks=[]}
function renderGrid(){
  const grid=$('#grid');[...mounts.keys()].forEach(id=>{unmount(id);mounts.delete(id)});grid.replaceChildren();
  const ws=layout().widgets;ws.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0));
  if(!ws.length)grid.append(h('div',{class:'empty'},h('p',{text:'This layout is empty.'}),h('button',{class:'btn primary',type:'button',onclick:()=>openSettings('widgets')},'Add a widget')));
  ws.forEach(inst=>put(grid,mountWidget(inst)));
  if(window.Sortable&&!gridSort)gridSort=new Sortable(grid,{handle:'.w-drag',draggable:'.w',filter:'.pinned .w-drag',animation:reducedMotion()?0:140,disabled:!editing,
    onStart(){snap()},
    onEnd(){const order=$$('.w',grid).map(e=>e.dataset.id),l=layout();l.widgets.sort((a,b)=>order.indexOf(a.id)-order.indexOf(b.id));save();if(l.widgets.some(w=>w.pinned))renderGrid()}});
}
const titleOf=inst=>inst.title||W[inst.type].name;
function frameAttrs(el,inst){
  const def=W[inst.type];
  el.className='w'+(def.bare&&!inst.title?' bare':'')+(inst.collapsed?' collapsed':'')+(inst.pinned?' pinned':'');
  el.dataset.w=inst.w;el.style.setProperty('--wn',inst.w);
  inst.row?el.dataset.row=inst.row:delete el.dataset.row;
  if(inst.h&&!inst.collapsed){el.style.height=inst.h+'px';el.dataset.fixed=''}else{el.style.height='';delete el.dataset.fixed}
}
function mountWidget(inst,preview){
  unmount(inst.id);
  const el=h('section',{'data-id':inst.id,'aria-label':titleOf(inst)}),body=h('div',{class:'w-b'});
  const m={el,body,ticks:[],clean:[],token:null,inst};mounts.set(inst.id,m);
  frameAttrs(el,inst);
  if(!preview){
    const fold=ib('fold',inst.collapsed?'Expand':'Collapse',()=>{inst.collapsed=!inst.collapsed;save();el.replaceWith(mountWidget(inst))},{'aria-expanded':String(!inst.collapsed)});
    put(el,h('div',{class:'w-h'},
      ib('grip','Drag to move. Keyboard: use the widget menu.',null,{class:'ib w-drag',tabindex:'-1'}),
      h('h2',{class:'w-t'},titleOf(inst),inst.pinned&&h('span',{class:'pinmark',title:'Pinned to the top'},' ',ico('pin'))),
      h('div',{class:'w-a'},fold,ib('more','Widget menu: '+titleOf(inst),e=>widgetMenu(inst,e.currentTarget)))),
      body,resizeHandle(inst,el));
  }else put(el,body);
  body.hidden=inst.collapsed;
  if(!inst.collapsed)renderBody(inst);
  return el;
}
function renderBody(inst){
  const m=mounts.get(inst.id);if(!m)return;
  unmount(inst.id);m.body.replaceChildren();
  const def=W[inst.type],token=m.token={},cfg={...def.cfg,...inst.cfg};
  if(!locals.has(inst.id))locals.set(inst.id,{});
  const ctx={inst,cfg,body:m.body,local:locals.get(inst.id),alive:()=>m.token===token,tick:f=>m.ticks.push(f),off:f=>m.clean.push(f),redraw:()=>renderBody(inst),
    set(patch){Object.assign(inst.cfg,patch);save();renderBody(inst)}};
  try{def.render(m.body,cfg,ctx)}
  catch(e){console.error(e);m.body.replaceChildren(h('p',{class:'werr',text:'This widget ran into a problem: '+e.message}),
    h('button',{class:'link',type:'button',onclick(){inst.cfg={};save();renderBody(inst)}},'Reset its settings'))}
}
function redrawType(type){mounts.forEach(m=>{if(m.inst.type===type&&!m.inst.collapsed)renderBody(m.inst)})}
function resizeHandle(inst,el){
  return h('div',{class:'w-rs',title:'Drag to resize. Double-click for automatic height.',
    ondblclick(){snap();inst.h=0;save();frameAttrs(el,inst)},
    onpointerdown(e){
      e.preventDefault();const hd=e.currentTarget;hd.setPointerCapture(e.pointerId);snap();
      const grid=$('#grid'),cs=getComputedStyle(grid),gap=parseFloat(cs.columnGap)||0,col=(grid.clientWidth-parseFloat(cs.paddingLeft)-parseFloat(cs.paddingRight)+gap)/12;
      const r=el.getBoundingClientRect(),x0=e.clientX,y0=e.clientY;let tall=false;
      const mv=ev=>{
        inst.w=clamp(Math.round((r.width+ev.clientX-x0+gap)/col),2,12);
        if(Math.abs(ev.clientY-y0)>12)tall=true;
        if(tall)inst.h=Math.max(80,Math.round((r.height+ev.clientY-y0)/10)*10);
        frameAttrs(el,inst);
      };
      const up=()=>{hd.removeEventListener('pointermove',mv);hd.removeEventListener('pointerup',up);hd.removeEventListener('pointercancel',up);save()};
      hd.addEventListener('pointermove',mv);hd.addEventListener('pointerup',up);hd.addEventListener('pointercancel',up);
    }});
}
function widgetMenu(inst,anchor){
  const l=layout(),ws=l.widgets,i=ws.indexOf(inst),si=SIZES.findIndex(s=>s[0]>=inst.w);
  const redo=()=>{save();renderGrid();focusWidget(inst.id)};
  const move=d=>{snap();ws.splice(i+d,0,ws.splice(i,1)[0]);redo()};
  menu(anchor,[
    {label:'Configure…',icon:'sliders',fn:()=>configureWidget(inst)},
    {label:inst.collapsed?'Expand':'Collapse',icon:'fold',fn(){inst.collapsed=!inst.collapsed;redo()}},
    {label:inst.pinned?'Unpin':'Pin to top',icon:'pin',fn(){snap();inst.pinned=!inst.pinned;redo()}},
    '-',
    {label:'Wider',disabled:inst.w>=12,fn(){snap();inst.w=(SIZES.find(s=>s[0]>inst.w)||[12])[0];redo()}},
    {label:'Narrower',disabled:inst.w<=2,fn(){snap();inst.w=([...SIZES].reverse().find(s=>s[0]<inst.w)||[2])[0];redo()}},
    {label:'Move earlier',icon:'up',disabled:i<=0||inst.pinned,fn:()=>move(-1)},
    {label:'Move later',icon:'down',disabled:i>=ws.length-1||inst.pinned,fn:()=>move(1)},
    state.layouts.length>1&&{label:'Move to another layout…',fn(){
      formDialog({title:'Move widget',fields:[{k:'to',label:'Layout',type:'select',opts:state.layouts.filter(x=>x!==l).map(x=>[x.id,x.name])}],values:{to:state.layouts.find(x=>x!==l).id},ok:'Move',
        onOk(v){snap();ws.splice(i,1);state.layouts.find(x=>x.id===v.to).widgets.push(inst);save();renderGrid()}})}},
    {label:'Duplicate',fn(){snap();const c=clone(inst);c.id=uid();ws.splice(i+1,0,c);redo()}},
    '-',
    {label:'Remove',icon:'trash',danger:true,fn(){snap();ws.splice(i,1);save();renderGrid();toast(`Removed ${titleOf(inst)}`,{action:'Undo',fn:undo})}}
  ]);
}
function focusWidget(id){const b=$(`.w[data-id="${id}"] .w-a .ib:last-child`);b&&b.focus()}
function configureWidget(inst){
  const def=W[inst.type],fields=typeof def.fields==='function'?def.fields(inst):def.fields;
  formDialog({title:def.name+' settings',
    fields:[...fields,
      {k:'_title',label:'Title',ph:def.name,help:def.bare?'Leave empty to show this widget without a heading.':null},
      {k:'_w',label:'Width',type:'select',opts:Array.from({length:11},(_,n)=>[n+2,`${n+2} of 12 columns`])},
      {k:'_row',label:'Placement',type:'select',opts:[['','Share the row with other widgets'],['start','Own row, left'],['center','Own row, centred'],['end','Own row, right']]},
      {k:'_h',label:'Height in pixels (0 = automatic)',type:'number',min:0,max:1600,step:10}],
    values:{...def.cfg,...inst.cfg,_title:inst.title,_w:inst.w,_row:inst.row,_h:inst.h},
    validate:def.validate,
    extra:()=>h('button',{type:'button',class:'link',onclick(e){snap();inst.cfg={};save();renderGrid();e.target.closest('dialog').close();toast('Widget settings reset')}},'Reset'),
    onOk(v){
      snap();inst.title=v._title.trim().slice(0,60);inst.w=clamp(+v._w,2,12);inst.row=v._row;inst.h=v._h?clamp(Math.round(v._h),80,1600):0;
      for(const f of fields){if(v[f.k]==null)delete inst.cfg[f.k];else inst.cfg[f.k]=v[f.k]}

}
function addWidget(type){
  snap();const inst=mk(type);layout().widgets.push(inst);save();renderGrid();
  const el=$(`.w[data-id="${inst.id}"]`);el&&el.scrollIntoView({block:'center',behavior:reducedMotion()?'auto':'smooth'});
  toast(`Added ${W[type].name}`,{action:'Undo',fn:undo});
}

/* one shared clock: widgets register a tick function, nothing runs for collapsed or hidden widgets */
function tickAll(){if(document.hidden)return;const now=new Date();mounts.forEach(m=>m.ticks.forEach(f=>{try{f(now)}catch(e){}}))}
function startTicker(){
  const go=()=>{checkAlarms();tickAll();setTimeout(go,1000-Date.now()%1000+5)};go();
  document.addEventListener('visibilitychange',()=>{if(document.hidden)persist.flush();else{checkAlarms();tickAll()}});
  addEventListener('pagehide',()=>persist.flush());
}

/* ═════════ 10. widgets: clock, greeting, search, bookmarks, tasks, notes, calendar ═════════ */
const ALIGN=[['left','Left'],['center','Centre'],['right','Right']];
const DATEFMT=[['none','Hidden'],['long','Monday 5 January'],['full','With year'],['short','Short'],['numeric','Numeric'],['iso','2026-01-05']];
const tzField={k:'tz',label:'Time zone',list:'tzs',ph:'local',help:'An IANA name such as Asia/Dhaka or Europe/London. Leave as "local" to follow this device.'};
const tzCheck=v=>validTz(v.tz||'local')?'':'That time zone is not recognised. Try a name like Europe/London.';

reg('clock',{name:'Clock',desc:'Time and date, in any time zone.',cat:'Time',w:12,bare:true,
  cfg:{h12:'auto',seconds:false,date:'long',tz:'local',size:1,align:'center',label:''},
  fields:[{k:'h12',label:'Format',type:'select',opts:[['auto','Follow general setting'],['24','24-hour'],['12','12-hour']]},
    {k:'seconds',label:'Show seconds',type:'check'},{k:'date',label:'Date',type:'select',opts:DATEFMT},tzField,
    {k:'label',label:'Caption',ph:'e.g. Dhaka'},{k:'size',label:'Size',type:'range',min:.4,max:1.6,step:.1},{k:'align',label:'Alignment',type:'select',opts:ALIGN}],
  validate:tzCheck,
  render(b,c,x){
    tzDatalist();
    const t=h('div',{class:'clock-t'}),d=h('div',{class:'clock-d'}),h12=c.h12==='auto'?state.prefs.h12:c.h12==='12';

function runSearch(q,engineId){
  q=q.trim();if(!q)return;
  const S=state.search;let eng=S.engines.find(e=>e.id===engineId)||S.engines[0],url;
  const m=/^!(\S+)\s+(.+)$/.exec(q);
  if(m){const k=S.engines.find(e=>e.key&&e.key===m[1].toLowerCase());if(k){eng=k;q=m[2]}}
  if(/^https?:\/\/\S+$/i.test(q))url=safeUrl(q);
  else if(/^[\w-]+(\.[\w-]+)+(:\d+)?(\/\S*)?$/.test(q)&&!/^\d+(\.\d+)?$/.test(q))url=safeUrl('https://'+q);
  if(!url){if(!eng){toast('No search engine is set up. Add one in Settings, under Search.',{err:true});return}url=eng.url.replace('%s',encodeURIComponent(q))}
  go(url,S.newTab);
}

function linkIcon(l,size){

/* Countdowns keep a target instant (epoch ms). What is shown is always target minus now, so sleep, reloads and throttled tabs cannot make it drift. */
function nextOccurrence(cd,now){
  if(!cd.repeat||cd.at>now)return cd.at;
  let t=cd.at,n=0;
  if(cd.repeat==='day'||cd.repeat==='week'){const step=cd.repeat==='day'?1:7,skip=Math.max(0,Math.floor((now-t)/864e5/step)-1);
    const d=new Date(epochToWall(t,cd.tz)+':00Z');d.setUTCDate(d.getUTCDate()+skip*step);t=wallToEpoch(d.toISOString().slice(0,16),cd.tz)}
  while(t<=now&&n++<800){
    const d=new Date(epochToWall(t,cd.tz)+':00Z');
    if(cd.repeat==='day')d.setUTCDate(d.getUTCDate()+1);else if(cd.repeat==='week')d.setUTCDate(d.getUTCDate()+7);
    else if(cd.repeat==='month')d.setUTCMonth(d.getUTCMonth()+1);else d.setUTCFullYear(d.getUTCFullYear()+1);
    t=wallToEpoch(d.toISOString().slice(0,16),cd.tz);
  }
  return t;
}

function parseDur(str){
  str=String(str).trim();if(!str)return NaN;
  if(/^\d+(\.\d+)?$/.test(str))return +str*60000;
  const p=str.split(':').map(Number);if(p.some(isNaN)||p.length>3)return NaN;
  return p.reduce((a,n)=>a*60+n,0)*1000;
}

/* ═════════ 12. widgets that use the network (clearly marked in the library; nothing is requested until you add one) ═════════ */
async function getJSON(url,asText){
  const ac=new AbortController(),t=setTimeout(()=>ac.abort(),12000);
  try{const r=await fetch(url,{signal:ac.signal,credentials:'omit',referrerPolicy:'no-referrer'});if(!r.ok)throw new Error('The service answered with error '+r.status+'.');return asText?r.text():r.json()}
  catch(e){throw new Error(e.name==='AbortError'?'The service took too long to answer.':!navigator.onLine?'You appear to be offline.':e.message==='Failed to fetch'||/NetworkError|Load failed/.test(e.message)?'The request was blocked or the service is unreachable.':e.message)}
  finally{clearTimeout(t)}
}
/* Shows cached data at once, refreshes when stale, and keeps the old data visible if the refresh fails. */
async function netLoad(x,box,key,ttl,fetcher,draw,force){
  const c=cacheGet(key),note=h('p',{class:'small muted',style:{marginTop:'6px'}});
  const retry=()=>h('button',{class:'link',type:'button',onclick:()=>netLoad(x,box,key,ttl,fetcher,draw,true)},'Try again');
  if(c){box.replaceChildren(draw(c.v),note);note.textContent='Updated '+fmtTime(new Date(c.t))}
  else box.replaceChildren(h('p',{class:'muted small',role:'status',text:'Loading…'}));
  if(c&&!force&&Date.now()-c.t<ttl)return;
  try{const v=await fetcher();if(!x.alive())return;cacheSet(key,v);box.replaceChildren(draw(v),note);note.textContent='Updated '+fmtTime(new Date())}
  catch(e){if(!x.alive())return;
    if(c){note.replaceChildren(`Could not refresh (${e.message}) Showing data from ${fmtDate(new Date(c.t),'short')}, ${fmtTime(new Date(c.t))}. `,retry())}
    else box.replaceChildren(h('p',{class:'small',role:'alert',text:e.message}),retry())}
}

/* A small recursive-descent parser. It never calls eval. */

  const term=()=>{let v=un();for(;;){if(tk[i]==='*'){i++;v*=un()}else if(tk[i]==='/'){i++;v/=un()}else if(/^mod$/i.test(tk[i]||'')){i++;v%=un()}else return v}};
  const un=()=>tk[i]==='-'?(i++,-un()):tk[i]==='+'?(i++,un()):pow();

  const post=()=>{let v=prim();while(tk[i]==='%'){i++;v/=100}return v};
  const prim=()=>{const t=tk[i++];if(t==null)throw new Error('Incomplete');

    if(n in K)return K[n];throw new Error('Unknown: '+t)};
  const v=expr();if(i<tk.length)throw new Error('Unexpected '+tk[i]);return v;
}

/* ═════════ 15. customisation manager: export, import, profiles, backups ═════════
   Each section knows how to read itself from a state, sanitise incoming data, and apply it by merging or replacing.
   apply() returns a short sentence describing what it did; the import preview runs it on a throwaway copy to get that sentence. */
function mergeList(cur,inc,key,fresh){
  const seen=new Set(cur.map(key));let added=0,same=0;
  inc.forEach(x=>{if(seen.has(key(x)))same++;else{seen.add(key(x));cur.push(fresh?fresh(x):{...x,id:uid()});added++}});
  return {added,same};
}
const plural=(n,w)=>`${n} ${w}${n===1?'':'s'}`;

    apply(v,mode){
      if(mode==='replace'&&!v.partial){const n=state.look.themes.length;state.look={theme:v.theme,custom:v.custom,themes:v.themes};return `Replaces the current look and ${plural(n,'custom theme')}`}
      const r=mergeList(state.look.themes,v.themes,t=>JSON.stringify({...t,id:0}),t=>({...t,id:'u'+uid()}));return said(r,'theme')}},
  {k:'layouts',name:'Layouts and widgets',get:s=>({layouts:s.layouts,active:s.active,grid:s.grid}),
    clean:v=>({layouts:CLEAN.layouts(isObj(v)?v.layouts:null),active:isObj(v)?v.active:'',grid:isObj(v)&&v.grid?CLEAN.grid(v.grid):null,partial:!isObj(v)||!v.grid}),
    info:v=>plural(v.layouts.length,'layout')+', '+plural(v.layouts.reduce((n,l)=>n+l.widgets.length,0),'widget'),
    apply(v,mode){
      if(mode==='replace'&&!v.partial){const n=state.layouts.length;state.layouts=clone(v.layouts);state.active=v.active;if(v.grid)state.grid=v.grid;return `Replaces ${plural(n,'current layout')}`}
      let renamed=0;v.layouts.forEach(l=>{const c=clone(l);c.id=uid();c.widgets.forEach(w=>w.id=uid());if(state.layouts.some(x=>x.name===c.name)){c.name=(c.name+' (imported)').slice(0,40);renamed++}state.layouts.push(c)});
      return `${plural(v.layouts.length,'layout')} added`+(renamed?`, ${renamed} renamed because the name was taken`:'')}},
  {k:'bookmarks',name:'Bookmarks',get:s=>s.data.bookmarks,clean:CLEAN.bookmarks,info:v=>plural(v.groups.length,'group')+', '+plural(v.groups.reduce((n,g)=>n+g.links.length,0),'link'),
    apply(v,mode){
      const B=state.data.bookmarks;if(mode==='replace'){const n=B.groups.reduce((a,g)=>a+g.links.length,0);state.data.bookmarks=clone(v);return `Replaces ${plural(n,'current link')}`}
      let ng=0,add=0,same=0;v.groups.forEach(g=>{let t=B.groups.find(x=>x.name.toLowerCase()===g.name.toLowerCase());if(!t){t={id:uid(),name:g.name,links:[]};B.groups.push(t);ng++}
        const r=mergeList(t.links,g.links,l=>l.url);add+=r.added;same+=r.same});
      return `${plural(add,'new link')} added`+(ng?` in ${plural(ng,'new group')}`:'')+(same?`, ${same} already here`:'')}},
  {k:'search',name:'Search engines',get:s=>s.search,clean:CLEAN.search,info:v=>plural(v.engines.length,'engine'),
    apply(v,mode){if(mode==='replace'){state.search=clone(v);return 'Replaces your engines and search options'}return said(mergeList(state.search.engines,v.engines,e=>e.url),'engine')}},
  {k:'prefs',name:'General preferences',get:s=>s.prefs,clean:CLEAN.prefs,info:()=>'Name, clock format, week start, privacy options',only:'replace',apply(v){state.prefs=clone(v);return 'Replaces your general preferences'}},
  {k:'tasks',name:'Tasks',get:s=>s.data.tasks,clean:CLEAN.tasks,info:v=>plural(v.length,'task'),
    apply(v,mode){if(mode==='replace'){const n=state.data.tasks.length;state.data.tasks=clone(v);return `Replaces ${plural(n,'current task')}`}return said(mergeList(state.data.tasks,v,t=>t.text),'task')}},

      const N=state.data.notes;if(N.length===1&&!N[0].text)N.length=0;const r=mergeList(N,v.filter(p=>p.text),p=>p.title+'\n'+p.text);if(!N.length)N.push({id:uid(),title:'Notes',text:''});return said(r,'page')}},
  {k:'time',name:'Countdowns and timers',get:s=>({countdowns:s.data.countdowns,timer:s.data.timer,stopwatch:s.data.stopwatch,pomo:s.data.pomo}),
    clean:v=>{v=isObj(v)?v:{};return {countdowns:CLEAN.countdowns(v.countdowns),timer:CLEAN.timer(v.timer),stopwatch:CLEAN.stopwatch(v.stopwatch),pomo:CLEAN.pomo(v.pomo)}},

  {k:'events',name:'Calendar entries',get:s=>s.data.events,clean:CLEAN.events,info:v=>plural(Object.values(v).reduce((n,l)=>n+l.length,0),'entry').replace('entrys','entries'),

  {k:'habits',name:'Habits',get:s=>s.data.habits,clean:CLEAN.habits,info:v=>plural(v.length,'habit'),
    apply(v,mode){const H=state.data.habits;if(mode==='replace'){state.data.habits=clone(v);return `Replaces ${plural(H.length,'current habit')}`}
      let a=0,m=0;v.forEach(x=>{const t=H.find(q=>q.name.toLowerCase()===x.name.toLowerCase());if(t){Object.assign(t.log,x.log);m++}else{H.push({...clone(x),id:uid()});a++}});return `${plural(a,'new habit')} added`+(m?`, ${m} merged with a habit of the same name`:'')}}

const stamp=()=>ymd(new Date());
async function buildExport(src,keys,pick){
  const sections={},images={};
  for(const d of SECTIONS){if(!keys.includes(d.k))continue;let v=clone(d.get(src));
    if(pick&&d.k==='layouts'&&pick.layouts){v.layouts=v.layouts.filter(l=>pick.layouts.includes(l.id));if(v.layouts.length<src.layouts.length){delete v.grid;delete v.active}}
    if(pick&&d.k==='look'&&pick.themes){v.themes=v.themes.filter(t=>pick.themes.includes(t.id));if(pick.onlyThemes){delete v.theme;delete v.custom}}
    sections[d.k]=v}
  if(sections.look){const ids=[sections.look.custom,...(sections.look.themes||[])].map(t=>t&&t.bg&&t.bg.imgId).filter(Boolean);
    for(const id of ids){const data=await idb.get('img:'+id);if(data)images[id]=data}}
  return {app:APP,format:FORMAT,exported:new Date().toISOString(),sections,images};
}
function saveFile(obj,name){download(`${APP}-${name.replace(/[^\w-]+/g,'-').toLowerCase()}-${stamp()}.json`,JSON.stringify(obj,null,1));toast('Exported. The file is in your downloads.')}
function exportOne(k,v,name){saveFile({app:APP,format:FORMAT,exported:new Date().toISOString(),sections:{[k]:clone(v)},images:{}},name)}

/* Reads and validates a file. Throws a plain-language error for anything unusable. */
function readImport(text){
  let f;try{f=JSON.parse(text)}catch(e){throw new Error('This file is not valid JSON, so it is not a configuration export.')}
  if(!isObj(f))throw new Error('This file does not contain a configuration.');
  if(f.app!==APP){
    if(isObj(f.layouts)||Array.isArray(f.layouts)&&isObj(f.data))f={app:APP,format:f.v||1,sections:Object.fromEntries(SECTIONS.map(d=>[d.k,d.get({...f,data:f.data||{}})])),images:{}}; // a raw saved state
    else throw new Error('This file was not exported from this start page.');
  }
  f=migrate(f,f.format);
  if(!isObj(f.sections))throw new Error('The file has no sections to import.');
  const parts=[];
  for(const d of SECTIONS){if(f.sections[d.k]===undefined)continue;dropped=0;
    try{const value=d.clean(f.sections[d.k]);parts.push({d,value,dropped,mode:d.only||'merge'})}catch(e){parts.push({d,error:'Unreadable, will be skipped',mode:'skip'})}}
  if(!parts.length)throw new Error('Nothing in this file can be imported here.');
  const images={};if(isObj(f.images))for(const k in f.images)if(/^[\w-]{1,40}$/.test(k)&&/^data:image\/(jpeg|png|webp);base64,/.test(f.images[k]))images[k]=f.images[k];
  return {parts,images,exported:typeof f.exported==='string'?f.exported:''};
}
function dryRun(p){const real=state;state=clone(real);try{return p.d.apply(clone(p.value),p.mode)}catch(e){return 'Cannot be applied'}finally{state=real}}
let pending=null;
async function applyImport(){
  const todo=pending.parts.filter(p=>p.mode!=='skip'&&!p.error);if(!todo.length){toast('Nothing selected to import.');return}
  await backup('Before import');snap();
  try{
    for(const id in pending.images)await idb.set('img:'+id,pending.images[id]).catch(()=>{});
    todo.forEach(p=>p.d.apply(clone(p.value),p.mode));
    state=cleanState(state);
  }catch(e){state=JSON.parse(undoStack.pop());toast('The import failed and nothing was changed: '+e.message,{err:true});return}
  pending=null;save();renderAll();renderSettings();
  toast(`Imported ${plural(todo.length,'section')}. A backup of the previous setup was kept.`,{action:'Undo',fn:undo,ms:9000});
}
function loadImportText(text,name){
  try{pending={...readImport(text),name};renderSettings()}
  catch(e){pending=null;toast(e.message,{err:true,ms:9000});renderSettings()}
}
function pickImport(){
  const i=h('input',{type:'file',accept:'.json,application/json',onchange(){const f=i.files[0];if(!f)return;
    if(f.size>30e6){toast('That file is too large to be a configuration export.',{err:true});return}
    f.text().then(t=>loadImportText(t,f.name),()=>toast('The file could not be read.',{err:true}))}});i.click();
}

/* automatic safety copies in IndexedDB */
async function backup(why){
  try{await idb.set('backup:'+Date.now(),{why,state:JSON.stringify(state)});
    const ks=(await idb.keys()).filter(k=>String(k).startsWith('backup:')).sort();for(const k of ks.slice(0,Math.max(0,ks.length-12)))await idb.del(k);return true}
  catch(e){return false}
}
/* profiles: named, complete setups. The active one is the live state; the others wait in localStorage. */
function profiles(){
  try{const p=JSON.parse(store.get(KEY.profiles));if(isObj(p)&&Array.isArray(p.list)&&p.list.some(x=>x.id===p.active))return p}catch(e){}
  return {active:'default',list:[{id:'default',name:'Default',data:null}]};
}
function putProfiles(p){return store.set(KEY.profiles,JSON.stringify(p))}
function switchProfile(id){
  const p=profiles(),cur=p.list.find(x=>x.id===p.active),to=p.list.find(x=>x.id===id);if(!to||to===cur)return;
  persist.flush();cur.data=clone(state);const next=cleanState(to.data||defaultState());to.data=null;p.active=id;
  if(!putProfiles(p)){toast('The profile could not be switched because browser storage is full.',{err:true});return}
  state=next;undoStack.length=0;store.set(KEY.state,JSON.stringify(state));renderAll();renderSettings();toast(`Switched to profile “${to.name}”`);
}

function managerPanel(b){
  const p=profiles(),nameDlg=(title,name,ok,fn)=>formDialog({title,fields:[{k:'name',label:'Name'}],values:{name},ok,validate:v=>v.name.trim()?'':'Give the profile a name.',onOk:v=>fn(v.name.trim().slice(0,40))});
  const newProf=(label,data)=>nameDlg(label,'Profile '+(p.list.length+1),'Create',n=>{const q=profiles();q.list.push({id:uid(),name:n,data});
    putProfiles(q)?toast(`Profile “${n}” created`):toast('Not enough browser storage for another profile.',{err:true});renderSettings(true)});
  add(b,[head('Customisation manager','Move, protect and restore your setup. Everything here works with files on your own device; nothing is uploaded.'),
    /* profiles */
    head('Profiles','Complete, separate setups, such as Work and Personal. Switching keeps each one exactly as you left it.'),
    p.list.map(x=>row(h('div',{},h('strong',{text:x.name}),x.id===p.active&&h('span',{class:'tag',style:{marginLeft:'8px'},text:'In use'})),null,
      x.id!==p.active&&h('button',{class:'btn sm',type:'button',onclick:()=>switchProfile(x.id)},'Switch to'),
      ib('pencil','Rename profile '+x.name,()=>nameDlg('Rename profile',x.name,'Save',n=>{const q=profiles();q.list.find(y=>y.id===x.id).name=n;putProfiles(q);renderSettings(true)})),
      ib('ext','Export profile '+x.name,async()=>saveFile(await buildExport(x.data?cleanState(x.data):state,SECTIONS.map(d=>d.k)),'profile-'+x.name)),
      ib('trash','Delete profile '+x.name,()=>confirmDialog(`Delete profile “${x.name}”?`,'Its layouts, bookmarks, tasks and notes are removed from this browser. This cannot be undone.','Delete profile',()=>{const q=profiles();q.list=q.list.filter(y=>y.id!==x.id);putProfiles(q);renderSettings(true)}),{disabled:x.id===p.active}))),
    h('div',{class:'flex wrap',style:{marginTop:'12px'}},h('button',{class:'btn',type:'button',onclick:()=>newProf('New profile from the current setup',clone(state))},'Copy current setup to a new profile'),
      h('button',{class:'btn',type:'button',onclick:()=>newProf('New empty profile',null)},'New empty profile'))]);

  /* export */
  const boxes={},subs={layouts:{},themes:{}};
  const chk=(label,on=true)=>{const c=h('input',{type:'checkbox',checked:on});return {c,el:h('label',{},c,h('span',{},label))}};
  const list=h('div',{class:'checks'});
  SECTIONS.forEach(d=>{const v=d.clean(clone(d.get(state))),x=chk([h('strong',{text:d.name}),h('span',{class:'small muted',style:{display:'block'},text:d.info(v)})]);boxes[d.k]=x.c;const cell=h('div',{},x.el);
    if(d.k==='layouts'&&state.layouts.length>1)state.layouts.forEach(l=>{const s=chk(l.name);subs.layouts[l.id]=s.c;s.el.className='sub';put(cell,s.el)});
    if(d.k==='look')state.look.themes.forEach(t=>{const s=chk('Theme: '+t.name);subs.themes[t.id]=s.c;s.el.className='sub';put(cell,s.el)});
    put(list,cell)});
  const all=on=>$$('input',list).forEach(c=>c.checked=on);
  add(b,[head('Export','Choose what goes into the file. The file is plain JSON and can be imported in any browser that has this page.'),list,
    h('div',{class:'flex wrap'},
      h('button',{class:'btn primary',type:'button',async onclick(){
        const keys=SECTIONS.map(d=>d.k).filter(k=>boxes[k].checked);if(!keys.length){toast('Tick at least one thing to export.',{err:true});return}
        const pick={layouts:Object.keys(subs.layouts).length?Object.keys(subs.layouts).filter(k=>subs.layouts[k].checked):null,themes:Object.keys(subs.themes).filter(k=>subs.themes[k].checked)};
        saveFile(await buildExport(state,keys,pick),keys.length===SECTIONS.length?'full':'selection')}},'Export selected'),
      h('button',{class:'link',type:'button',onclick:()=>all(true)},'Select all'),h('button',{class:'link',type:'button',onclick:()=>all(false)},'Select none'))]);

  /* import */
  const drop=h('div',{class:'drop',ondragover(e){e.preventDefault();drop.classList.add('over')},ondragleave(){drop.classList.remove('over')},
    ondrop(e){e.preventDefault();drop.classList.remove('over');const f=e.dataTransfer.files[0];if(f)f.text().then(t=>loadImportText(t,f.name))}},
    'Drop an exported file here, or ',h('button',{class:'link',type:'button',style:{fontSize:'inherit'},onclick:pickImport},'choose a file'),'.');
  add(b,[head('Import','Nothing changes until you press Apply. The file is checked first and you decide, part by part, what happens.'),drop]);
  if(pending){
    const tb=h('tbody');
    pending.parts.forEach(pt=>{
      const res=h('td',{class:'small'}),show=()=>res.textContent=pt.error||(pt.mode==='skip'?'Left out':dryRun(pt))+(pt.dropped?`. ${plural(pt.dropped,'damaged record')} in the file will be ignored`:'');
      const canMerge=!pt.d.only,canReplace=!(pt.value&&pt.value.partial);
      const sel=h('select',{class:'in','aria-label':'What to do with '+pt.d.name,disabled:!!pt.error,value:pt.mode,onchange(){pt.mode=sel.value;show()}},
        [canMerge&&['merge','Merge with mine'],canReplace&&['replace','Replace mine'],['skip','Skip']].filter(Boolean).map(o=>h('option',{value:o[0],text:o[1]})));
      show();put(tb,h('tr',{},h('td',{},h('strong',{text:pt.d.name}),h('div',{class:'small muted',text:pt.error?'':pt.d.info(pt.value)})),h('td',{},sel),res));
    });
    add(b,[h('div',{class:'pv',role:'region','aria-label':'Import preview'},h('p',{},h('strong',{text:'Preview of '+(pending.name||'the file')}),pending.exported&&h('span',{class:'small muted',text:'  exported '+fmtDate(new Date(pending.exported),'full')})),
      h('table',{class:'tbl'},h('thead',{},h('tr',{},h('th',{scope:'col',text:'In the file'}),h('th',{scope:'col',text:'Action'}),h('th',{scope:'col',text:'Result'}))),tb),
      h('div',{class:'flex wrap',style:{marginTop:'12px'}},h('button',{class:'btn primary',type:'button',onclick:applyImport},'Apply import'),h('button',{class:'btn',type:'button',onclick(){pending=null;renderSettings(true)}},'Discard'),
        h('span',{class:'small muted',text:'A backup of the current setup is made first.'})))]);
  }

  /* backups */
  const bl=h('div',{},h('p',{class:'small muted',text:'Looking for backups…'}));
  add(b,[head('Backups','Safety copies kept in this browser, made automatically before an import, a restore or a reset. The newest twelve are kept. They disappear with the browser\'s site data, so export a file for anything you cannot lose.'),bl,
    h('div',{class:'flex wrap',style:{marginTop:'10px'}},h('button',{class:'btn',type:'button',async onclick(){(await backup('Made by hand'))?toast('Backup made'):toast('This browser would not store a backup. Export a file instead.',{err:true});renderSettings(true)}},'Back up now'),
      h('button',{class:'btn',type:'button',async onclick(){saveFile(await buildExport(state,SECTIONS.map(d=>d.k)),'full')}},'Export everything to a file'))]);
  idb.keys().then(async ks=>{
    ks=ks.filter(k=>String(k).startsWith('backup:')).sort().reverse();bl.replaceChildren();
    if(!ks.length)bl.append(h('p',{class:'small muted',text:'No backups yet.'}));
    for(const k of ks){const rec=await idb.get(k),t=new Date(+k.slice(7));if(!rec)continue;
      put(bl,row(fmtDate(t,'full')+', '+fmtTime(t),rec.why,
        h('button',{class:'btn sm',type:'button',onclick:()=>confirmDialog('Restore this backup?','The current setup is backed up first, then replaced by the one from '+fmtDate(t,'short')+', '+fmtTime(t)+'.','Restore',async()=>{
          let s;try{const o=JSON.parse(rec.state);s=cleanState(migrate(o,o.v))}catch(e){toast('This backup is damaged and cannot be restored.',{err:true});return}
          await backup('Before restoring a backup');snap();state=s;save();renderAll();renderSettings();toast('Backup restored',{action:'Undo',fn:undo})})},'Restore'),
        ib('ext','Download this backup as a file',async()=>{try{saveFile(await buildExport(cleanState(JSON.parse(rec.state)),SECTIONS.map(d=>d.k)),'backup')}catch(e){toast('This backup is damaged.',{err:true})}}),
        ib('trash','Delete this backup',async()=>{await idb.del(k);renderSettings(true)})))}
  });

  /* reset */
  const wipe=(title,note,fn)=>confirmDialog(title,note+' A backup is made first, and Undo works until you reload.','Reset',async()=>{await backup('Before a reset');snap();fn();state=cleanState(state);save();renderAll();renderSettings();toast('Reset done',{action:'Undo',fn:undo})});
  add(b,[head('Reset'),
    row('Appearance','Back to the Plain theme, removing adjustments. Custom themes are kept.',h('button',{class:'btn',type:'button',onclick:()=>wipe('Reset appearance?','The theme and its adjustments go back to the defaults.',()=>{state.look.theme='plain';state.look.custom={}})},'Reset')),
    row('Layouts','One layout with clock, search and bookmarks.',h('button',{class:'btn',type:'button',onclick:()=>wipe('Reset layouts?','All layouts are replaced by the starting one. Bookmarks, tasks and notes stay.',()=>{const d=defaultState();state.layouts=d.layouts;state.active=d.active;state.grid=d.grid})},'Reset')),
    row('Everything in this profile','Layouts, themes, bookmarks, tasks, notes, timers and preferences.',h('button',{class:'btn danger',type:'button',onclick:()=>wipe('Reset everything?','This profile returns to the way the page first looked.',()=>{state=defaultState()})},'Reset everything'))]);
}

/* ═════════ 16. start-up ═════════ */
function shortcuts(e){
  if(e.key==='Escape'&&editing&&!$('dialog[open]')&&!openMenu){setEditing(false);return}
  if(e.defaultPrevented||$('dialog[open]')||openMenu)return;
  if((e.ctrlKey||e.metaKey)&&!e.shiftKey&&e.key.toLowerCase()==='z'&&!typing(e)){e.preventDefault();undo();return}
  if(typing(e)||e.ctrlKey||e.metaKey||e.altKey)return;
  const k=e.key;
  if(k==='/'){const s=$('[data-search]');if(s){e.preventDefault();s.focus();s.select()}}
  else if(k==='e'||k==='E')setEditing(!editing);
  else if(k==='a'||k==='A'){e.preventDefault();openSettings('widgets')}
  else if(k===','){e.preventDefault();openSettings()}
  else if(k==='?'){e.preventDefault();openSettings('help')}
  else if(/^[1-9]$/.test(k)&&state.layouts[+k-1])switchLayout(state.layouts[+k-1].id);
}
document.addEventListener('DOMContentLoaded',()=>{
  const r=loadState();state=r.s;
  renderAll();startTicker();
  document.addEventListener('keydown',shortcuts);
  if(r.first)store.set(KEY.state,JSON.stringify(state));
  if(r.bad)toast('The saved setup could not be read, so the page started fresh. The unreadable data was kept aside in browser storage.',{err:true,ms:12000});
  /* another tab of this page may have changed things while this one was in the background */
  addEventListener('storage',e=>{
    if(e.key!==KEY.state||!e.newValue||document.hasFocus()||$('dialog[open]'))return;
    try{const o=JSON.parse(e.newValue);state=cleanState(migrate(o,o.v));undoStack.length=0;renderAll()}catch(err){}
  });
  if(navigator.storage&&navigator.storage.persist)navigator.storage.persist().catch(()=>{});
});
</script>
