<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Funded CS Master's abroad: decision dashboard</title>
<style>
:root{--bg:#fafafa;--fg:#1f2328;--muted:#6b7280;--line:#e1e4e8;--card:#ffffff;--acc:#1f4e79;--grey:#e5e7eb;--hatch:#cfd3d8;--chip:#f1f3f5}
html[data-theme="dark"]{--bg:#121417;--fg:#e6e8eb;--muted:#9aa3ad;--line:#2a2f36;--card:#1a1e23;--acc:#6fa8dc;--grey:#2a2f36;--hatch:#3a4049;--chip:#242a31}
*{box-sizing:border-box}
body{margin:0;font-family:Arial,Helvetica,sans-serif;font-size:14px;background:var(--bg);color:var(--fg)}
header{display:flex;gap:12px;align-items:center;justify-content:space-between;padding:12px 16px;border-bottom:1px solid var(--line);background:var(--card);flex-wrap:wrap}
h1{font-size:17px;margin:0;color:var(--acc)} .sub{color:var(--muted);font-size:12px}
button,select,input{font:inherit;color:var(--fg);background:var(--card);border:1px solid var(--line);border-radius:6px;padding:6px 8px}
button{cursor:pointer} button:hover{border-color:var(--acc)}
.controls{display:flex;flex-wrap:wrap;gap:10px;padding:10px 16px;background:var(--card);border-bottom:1px solid var(--line);align-items:end}
.controls label{display:flex;flex-direction:column;font-size:11px;color:var(--muted);gap:3px}
.banner{margin:10px 16px;padding:8px 12px;border:1px solid var(--line);border-left:3px solid var(--acc);background:var(--card);font-size:12px;color:var(--muted)}
main{display:grid;grid-template-columns:minmax(0,1.7fr) minmax(280px,1fr);gap:12px;padding:0 16px 16px}
.card{background:var(--card);border:1px solid var(--line);border-radius:8px;overflow:hidden}
.card h2{font-size:13px;margin:0;padding:8px 12px;border-bottom:1px solid var(--line);display:flex;justify-content:space-between;align-items:center}
#mapwrap{position:relative} svg{display:block;width:100%;height:auto;background:var(--card);touch-action:none;cursor:grab}
svg path{stroke:var(--card);stroke-width:.4;vector-effect:non-scaling-stroke}
.c-un{fill:var(--hatch);opacity:.45} .c-res{fill:var(--acc)} .c-none{fill:var(--grey)} svg path:hover{stroke:var(--fg);stroke-width:1}
.mapbtns{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:4px}
.legend{display:flex;gap:14px;align-items:center;padding:8px 12px;font-size:11px;color:var(--muted);flex-wrap:wrap;border-top:1px solid var(--line)}
.sw{display:inline-block;width:14px;height:10px;border:1px solid var(--line);vertical-align:middle;margin-right:4px}
.grad{width:90px;height:10px;background:linear-gradient(90deg,color-mix(in srgb,var(--acc) 15%,transparent),var(--acc));border:1px solid var(--line)}
#list{max-height:440px;overflow:auto} .row{display:flex;justify-content:space-between;gap:8px;padding:8px 12px;border-bottom:1px solid var(--line);cursor:pointer}
.row:hover{background:var(--chip)} .chip{display:inline-block;padding:1px 7px;border-radius:10px;background:var(--chip);font-size:11px;border:1px solid var(--line)}
.chip.acc{background:var(--acc);color:var(--card);border-color:var(--acc)}
.bar{height:6px;background:var(--grey);border-radius:3px;overflow:hidden;margin-top:4px}.bar i{display:block;height:100%;background:var(--acc)}
table{width:100%;border-collapse:collapse;font-size:12px} th,td{padding:6px 8px;border-bottom:1px solid var(--line);text-align:left;vertical-align:top}
th{position:sticky;top:0;background:var(--chip);cursor:pointer;white-space:nowrap}
.tw{overflow:auto;max-height:520px} a{color:var(--acc)}
#panel{position:fixed;top:0;right:0;width:440px;max-width:100%;height:100%;background:var(--card);border-left:1px solid var(--line);box-shadow:-6px 0 18px rgba(0,0,0,.12);transform:translateX(105%);transition:transform .2s;overflow:auto;z-index:10;padding:14px}
#panel.open{transform:none} #panel h3{margin:14px 0 6px;font-size:13px;color:var(--acc)} #panel p{margin:4px 0}
.kv{display:grid;grid-template-columns:130px 1fr;gap:3px 8px;font-size:12px} .kv b{color:var(--muted);font-weight:normal}
.yr{display:flex;gap:6px;flex-wrap:wrap}.yr div{flex:1;min-width:64px;border:1px solid var(--line);border-radius:6px;padding:4px 6px;font-size:11px}
.warn{color:var(--muted);font-size:11px}
footer{padding:12px 16px 24px;color:var(--muted);font-size:11px}
@media (max-width:900px){main{grid-template-columns:1fr}}
</style>
</head>
<body>
<header>
  <div><h1>Funded CS Master's abroad: decision dashboard</h1><div class="sub" id="ver"></div></div>
  <div style="display:flex;gap:8px"><button id="theme">Light / dark</button></div>
</header>
<div class="controls">
  <label>Intake year<select id="fYear"></select></label>
  <label>Region<select id="fRegion"><option>All</option><option>Europe</option><option>Australia</option><option>Asia</option></select></label>
  <label>Funding level<select id="fFunding"><option>All</option><option>Fully funded</option><option>Mostly funded</option><option>Partial</option><option>None</option></select></label>
  <label>Budget feasible<select id="fBudget"><option value="No">No filter</option><option value="Running costs">Running costs covered</option><option value="Strict">Strict (incl. upfront cash)</option></select></label>
  <label>Return obligation<select id="fRet"><option>Any</option><option>None</option></select></label>
  <label>Experience required<select id="fExp"><option>Any</option><option value="none">None required</option><option value="req">Required</option></select></label>
  <label>Degree-age / gap limit<select id="fLim"><option>Any</option><option value="has">Has a limit</option><option value="no">No limit found</option></select></label>
  <label><span>Bangladesh eligible only</span><input type="checkbox" id="fBd"></label>
  <label><span>Hide ineligible for my scenario</span><input type="checkbox" id="fElig" checked></label>
  <label>Search<input id="fQ" placeholder="name, country, ID"></label>
</div>
<div class="banner" id="banner"></div>
<main>
  <section class="card">
    <h2><span>World map: best score per country for the selected intake</span><span class="warn" id="mapnote"></span></h2>
    <div id="mapwrap"><svg id="map" viewBox="0 0 1000 400"></svg>
      <div class="mapbtns"><button id="zin">+</button><button id="zout">-</button><button id="zeu">Europe</button><button id="zas">Asia</button><button id="zw">World</button></div></div>
    <div class="legend"><span><i class="grad sw" style="width:80px"></i> low to high score</span><span><i class="sw" style="background:var(--grey)"></i> researched, no match for filters</span><span><i class="sw" style="background:var(--hatch)"></i> not yet researched</span><span>Circle = pan-European Erasmus Mundus</span></div>
  </section>
  <section class="card"><h2><span>Countries</span><span class="warn">click to open</span></h2><div id="list"></div></section>
</main>
<main style="grid-template-columns:1fr">
  <section class="card"><h2><span>Scholarships and routes</span><span class="warn" id="cnt"></span></h2><div class="tw"><table id="tbl"></table></div></section>
</main>
<div id="panel"></div>
<footer id="foot"></footer>

<script>
const D=JSON.parse(document.getElementById('data').textContent), GEO=JSON.parse(document.getElementById('geo').textContent);
const $=id=>document.getElementById(id), esc=s=>String(s==null?'':s).replace(/[&<>"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const fmt=n=>n==null||n===''||isNaN(n)?'Unknown':Math.round(n).toLocaleString('en-US');
const C=Object.fromEntries(D.countries.map(c=>[c.code,c])), ISO=Object.fromEntries(D.countries.map(c=>[c.iso3,c]));
let sortKey='score', sortDir=-1;
// theme
const pref=matchMedia('(prefers-color-scheme: dark)').matches?'dark':'light'; document.documentElement.dataset.theme=pref;
$('theme').onclick=()=>{document.documentElement.dataset.theme=document.documentElement.dataset.theme==='dark'?'light':'dark'};
$('fYear').innerHTML=D.years.map(y=>`<option>${y}</option>`).join('');
$('ver').textContent=`Dataset ${D.version} | schema ${D.schema} | built ${D.build} | ${D.phase}`;
$('banner').innerHTML=`<b>Read this first:</b> 29 countries plus five Erasmus Mundus programmes have some research. Denmark, Spain, Portugal, Latvia, Greece, Cyprus, Slovenia, Slovakia and Luxembourg were only briefly searched (no verified Bangladesh-eligible funded route). Grey hatched countries are <b>not researched</b>, which does not mean they are bad. Scores are a snapshot using the default weights; change weights and inputs in the Excel workbook. Family spending cap: BDT ${fmt(D.budget)} per year. Proof-of-funds balances are treated as showable; part-time income of EUR ${D.part.eur_month||0}/month is assumed (included: ${D.part.include||'No'}). Rate used: 1 EUR = ${D.eur} BDT.`;
$('foot').innerHTML='Not legal, immigration or financial advice. Verify every deadline and rule on the official source. Confidence labels (Verified / Estimated / Unknown) and sources per data point are in the workbook (Evidence_Log, Sources_Log) and dataset.json.';
// ---- filters
function st(){return{year:$('fYear').value,region:$('fRegion').value,fund:$('fFunding').value,bud:$('fBudget').value,ret:$('fRet').value,exp:$('fExp').value,lim:$('fLim').value,bd:$('fBd').checked,el:$('fElig').checked,q:$('fQ').value.trim().toLowerCase()}}
function pass(s,f){const p=s.per[f.year],c=C[s.cc];
 if(f.region!=='All'&&c.region!==f.region)return false; if(f.fund!=='All'&&s.level!==f.fund)return false;
 if(f.bud==='Running costs'&&p.flag==='Infeasible')return false; if(f.bud==='Strict'&&p.flag!=='Feasible')return false;
 if(f.ret==='None'&&s.ret!=='None')return false; if(f.bd&&s.bd==='N')return false; if(f.el&&p.elig==='N')return false;
 const hasExp=Number(s.minexp)>0; if(f.exp==='none'&&hasExp)return false; if(f.exp==='req'&&!hasExp)return false;
 const hasLim=s.maxdeg!==''&&s.maxdeg!=null&&s.maxdeg!=='Unknown'; if(f.lim==='has'&&!hasLim)return false; if(f.lim==='no'&&hasLim)return false;
 if(f.q&&!(s.name+' '+c.name+' '+s.id).toLowerCase().includes(f.q))return false; return true}
// ---- map
const K=1000/360, W=1000, H=400; const P=(lon,lat)=>[(lon+180)*K,(83-lat)*K];
function ring(r){return 'M'+r.map(p=>{const q=P(p[0],p[1]);return q[0].toFixed(1)+' '+q[1].toFixed(1)}).join('L')+'Z'}
function pathOf(g){return g.t==='Polygon'?g.c.map(ring).join(''):g.c.map(pl=>pl.map(ring).join('')).join('')}
const svg=$('map'); let shapes={};
svg.innerHTML=GEO.filter(f=>f.id!=='ATA').map(f=>`<path data-iso="${f.id}" d="${pathOf(f.g)}"><title>${esc(f.n)}</title></path>`).join('')+'<g id="mk"></g>';
svg.querySelectorAll('path').forEach(p=>{shapes[p.dataset.iso]=p; p.onclick=()=>{const c=ISO[p.dataset.iso]; if(c)openPanel(c.code)}});
let vb={x:0,y:0,w:W,h:H}; const setVB=()=>svg.setAttribute('viewBox',`${vb.x} ${vb.y} ${vb.w} ${vb.h}`);
function zoom(f,cx,cy){const nx=vb.w*f,ny=vb.h*f; vb.x=cx-(cx-vb.x)*f; vb.y=cy-(cy-vb.y)*f; vb.w=nx; vb.h=ny; setVB()}
svg.addEventListener('wheel',e=>{e.preventDefault();const r=svg.getBoundingClientRect();zoom(e.deltaY>0?1.15:.87,vb.x+(e.clientX-r.left)/r.width*vb.w,vb.y+(e.clientY-r.top)/r.height*vb.h)},{passive:false});
let drag=null; svg.addEventListener('pointerdown',e=>{drag={x:e.clientX,y:e.clientY,vx:vb.x,vy:vb.y}}); addEventListener('pointerup',()=>drag=null);
addEventListener('pointermove',e=>{if(!drag)return;const r=svg.getBoundingClientRect();vb.x=drag.vx-(e.clientX-drag.x)/r.width*vb.w;vb.y=drag.vy-(e.clientY-drag.y)/r.height*vb.h;setVB()});
$('zin').onclick=()=>zoom(.7,vb.x+vb.w/2,vb.y+vb.h/2); $('zout').onclick=()=>zoom(1.4,vb.x+vb.w/2,vb.y+vb.h/2);
const view=(lon0,lat0,lon1,lat1)=>{const a=P(lon0,lat0),b=P(lon1,lat1);vb={x:a[0],y:a[1],w:b[0]-a[0],h:b[1]-a[1]};setVB()};
$('zeu').onclick=()=>view(-15,72,45,33); $('zas').onclick=()=>view(35,50,155,-45); $('zw').onclick=()=>{vb={x:0,y:0,w:W,h:H};setVB()};
// ---- render
function render(){
 const f=st(), rows=D.sch.filter(s=>pass(s,f)), best={};
 rows.forEach(s=>{const sc=s.per[f.year].score; if(!(s.cc in best)||sc>best[s.cc])best[s.cc]=sc});
 const hasSch=new Set(D.sch.map(s=>s.cc));
 Object.entries(shapes).forEach(([iso,p])=>{const c=ISO[iso]; if(!c||c.code==='EU'){p.setAttribute('class','c-un');p.style.opacity='';return}
   if(!hasSch.has(c.code)){p.setAttribute('class','c-un');p.style.opacity='';return}
   if(c.code in best){p.setAttribute('class','c-res');p.style.opacity=(.2+.8*Math.max(0,Math.min(1,best[c.code]/100))).toFixed(2)}else{p.setAttribute('class','c-none');p.style.opacity=''}});
 // EU marker
 const eu=C.EU,q=P(eu.lon+6,eu.lat+3.5); const eb=best.EU;
 $('mk').innerHTML=`<circle cx="${q[0]}" cy="${q[1]}" r="5" fill="${eb!=null?'var(--acc)':'var(--grey)'}" fill-opacity="${eb!=null?(.3+.7*eb/100).toFixed(2):1}" stroke="var(--fg)" stroke-width=".8" style="cursor:pointer" onclick="openPanel('EU')"><title>Erasmus Mundus (multi-country)</title></circle>`;
 $('mapnote').textContent=`${rows.length} matching routes`;
 // list
 const cs=D.countries.filter(c=>hasSch.has(c.code)).sort((a,b)=>(best[b.code]??-1)-(best[a.code]??-1));
 const unr=D.countries.filter(c=>!hasSch.has(c.code));
 $('list').innerHTML=cs.map(c=>`<div class="row" onclick="openPanel('${c.code}')"><div><b>${esc(c.name)}</b><div class="bar"><i style="width:${best[c.code]||0}%"></i></div></div><div style="text-align:right"><span class="chip ${c.cls==='Target now'?'acc':''}">${esc(c.cls)}</span><div class="warn">${c.code in best?best[c.code].toFixed(1):'no match'}</div></div></div>`).join('')+
   `<div class="row" style="cursor:default"><div class="warn">Not yet researched (${unr.length}): ${unr.map(c=>esc(c.name.replace(' (optional)',''))).join(', ')}</div></div>`;
 // table
 const key={score:s=>s.per[f.year].score,stip:s=>s.stip,oop:s=>s.oop,name:s=>s.name,cc:s=>C[s.cc].name,dl:s=>s.dl};
 rows.sort((a,b)=>{const x=key[sortKey](a),y=key[sortKey](b);return (x>y?1:x<y?-1:0)*sortDir});
 const th=(k,t)=>`<th data-k="${k}">${t}${sortKey===k?(sortDir>0?' ▲':' ▼'):''}</th>`;
 $('tbl').innerHTML=`<thead><tr>${th('name','Scholarship / route')}${th('cc','Country')}${th('score','Score')}<th>Eligibility</th><th>Budget flag</th>${th('stip','Stipend BDT/mo')}${th('oop','Out-of-pocket BDT/yr (after part-time)')}<th>Competition</th>${th('dl','Latest deadline')}<th>Return</th><th>Link</th></tr></thead><tbody>`+
  rows.map(s=>{const p=s.per[f.year];return `<tr><td><a href="#" onclick="openPanel('${s.cc}');return false">${esc(s.name)}</a><div class="warn">${esc(s.id)} | ${esc(s.level)}</div></td><td>${esc(C[s.cc].name)}</td><td><b>${p.score.toFixed(1)}</b></td><td>${esc(p.elig)}</td><td>${esc(p.flag)}</td><td>${fmt(s.stip)}</td><td>${fmt(s.oop)}</td><td>${esc(s.comp)}</td><td>${esc(s.dl)}</td><td>${esc(s.ret)}</td><td>${String(s.url).startsWith('http')?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Official</a>`:'-'}</td></tr>`}).join('')+'</tbody>';
 $('tbl').querySelectorAll('th[data-k]').forEach(h=>h.onclick=()=>{const k=h.dataset.k;if(sortKey===k)sortDir*=-1;else{sortKey=k;sortDir=k==='score'||k==='stip'?-1:1}render()});
 $('cnt').textContent=`${rows.length} of ${D.sch.length} shown`;
 if(window.__open)openPanel(window.__open,true)}
// ---- panel
function openPanel(code,keep){window.__open=code; const f=st(), c=C[code]; const mine=D.sch.filter(s=>s.cc===code).sort((a,b)=>b.per[f.year].score-a.per[f.year].score);
 const reqs=D.req.filter(r=>r.country===code), vm=D.verify.filter(v=>v.country===code||v.country==='ALL'), pol=D.policy.filter(p=>p.country===code);
 const ts=c.tscore; const yrs=D.years.map(y=>`<div><b>${y}</b><br>${ts[y]==null?'-':ts[y].toFixed(1)}</div>`).join('');
 $('panel').innerHTML=`<div style="display:flex;justify-content:space-between"><h2 style="margin:0">${esc(c.name)}</h2><button onclick="closePanel()">Close</button></div>
 <p><span class="chip ${c.cls==='Target now'?'acc':''}">${esc(c.cls)}</span> <span class="chip">${esc(c.status)}</span></p>
 <p lang="bn">${esc(c.bn)}</p>
 <h3>Triage score per intake</h3><div class="yr">${yrs}</div><p class="warn">${esc(c.why||'Not researched yet.')}</p>
 <h3>Key facts</h3><div class="kv"><b>Living cost</b><span>${c.living?`EUR ${fmt(c.living)}/month (about BDT ${fmt(c.living*D.eur)}) [proxy or placeholder: see workbook]`:'Unknown'}</span><b>Work while studying</b><span>${esc(c.work)}</span><b>Post-study permit (months)</b><span>${esc(c.post)}</span><b>Years to PR</b><span>${esc(c.pr)}</span><b>Junior IT salary</b><span>${esc(c.sal)}</span></div>
 <h3>Requirements to fulfil (set status in Excel)</h3>${reqs.length?reqs.map(r=>`<p><b>${esc(r.name)}</b> ${r.blocking==='Y'?'<span class="chip acc">blocking</span>':''}<br><span class="warn">${esc(r.details)}<br>Effort ${r.effort_months} months | needed by ${esc(r.needed_by[f.year])} | ${esc(r.conf)} | ${esc(r.sources)}</span></p>`).join(''):'<p class="warn">None recorded yet.</p>'}
 <h3>Ranked scholarships and routes (${f.year})</h3>${mine.length?mine.map(s=>{const p=s.per[f.year];return `<p><b>${esc(s.name)}</b><br><span class="chip">${p.score.toFixed(1)}</span> <span class="chip">${esc(p.elig)}</span> <span class="chip">${esc(p.flag)}</span> <span class="chip">${esc(s.level)}</span><br>
 <span class="warn">Stipend BDT ${fmt(s.stip)}/mo | out-of-pocket after part-time BDT ${fmt(s.oop)}/yr | upfront cash BDT ${fmt(s.up)}<br>Window: ${esc(s.win[f.year])}<br>Tuition: ${esc(s.tuition)}<br>Competition: ${esc(s.comp)} | return: ${esc(s.retTxt)}<br><i>${esc(s.why)}</i><br>Improve: ${esc(s.improve)}</span><br><span lang="bn">${esc(s.bn)}</span><br>${String(s.url).startsWith('http')?`<a href="${esc(s.url)}" target="_blank" rel="noopener">Official page</a>`:''}</p>`}).join(''):'<p class="warn">No scholarships recorded yet.</p>'}
 <h3>Policy watch</h3>${pol.length?pol.map(p=>`<p><b>${esc(p.topic)}</b><br><span class="warn">${esc(p.detail)}<br>${esc(p.label)} | ${esc(p.effective)}</span></p>`).join(''):'<p class="warn">None recorded.</p>'}
 <h3>Still to verify</h3>${vm.map(v=>`<p class="warn">${esc(v.id)}: ${esc(v.question)}</p>`).join('')}`;
 $('panel').classList.add('open')}
function closePanel(){window.__open=null;$('panel').classList.remove('open')}
['fYear','fRegion','fFunding','fBudget','fRet','fExp','fLim','fBd','fElig','fQ'].forEach(i=>$(i).addEventListener('input',render));
render();
</script>
</body>
</html>
